/* ---- xland.world backend: the same db/user interface as the Claude runtime, served by the Xland Worker and D1.
   A citizen is a device key kept in this browser; the server stores only its hash. Changes arrive by polling,
   faster on social pages and paused while the tab is hidden. ---- */
let serverMode=false, serverBE=null;
const KEY_LS='xland.key', ADMIN_LS='xland.admin';
function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} }
function newDeviceKey(){ const b=new Uint8Array(32); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function serverBackend(){
  let key=lsGet(KEY_LS); if(!/^[A-Za-z0-9_\-]{32,128}$/.test(key)){ key=newDeviceKey(); lsSet(KEY_LS,key); }
  const call=async(method,path,body)=>{ const h={'x-xland-key':key}, a=lsGet(ADMIN_LS); if(a) h['x-xland-admin']=a; if(body) h['content-type']='application/json';
    const r=await fetch('/api'+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'}); let j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok){ const e=new Error(j.error||('The shared world answered '+r.status)); e.status=r.status; e.code=r.status===403?'invalid_argument':r.status===409?'already_exists':r.status===429?'resource_exhausted':'unavailable'; throw e; } return j; };
  const store={}, subs={}; let since=0, me=null, synced=false, timer=null;
  const snapOf=(id,d)=>({id, exists:d!=null, data:()=>d});
  const emitCol=c=>{ const m=store[c]||{}, docs=Object.keys(m).map(id=>snapOf(id,m[id].d)); (subs[c]||[]).forEach(cb=>{ try{ cb({docs}); }catch(e){ console.error(e); } }); };
  const put=(c,id,d,u)=>{ const m=store[c]||(store[c]={}); if(m[id]&&m[id].u>=u) return false; m[id]={d,u}; return true; };
  async function sync(){ try{ const j=await call('GET','/sync?since='+Math.max(0,since-5000)); const ch=new Set(); (j.docs||[]).forEach(x=>{ if(put(x.c,x.id,x.d,x.u)) ch.add(x.c); }); since=j.now;
      if(!synced){ synced=true; Object.keys(subs).forEach(emitCol); } else ch.forEach(emitCol); }catch(e){} }
  function loop(){ clearTimeout(timer); const r=parse().route, hot=['world','place','region','parcel','founder'].includes(r);
    timer=setTimeout(async()=>{ if(document.visibilityState!=='hidden') await sync(); loop(); }, hot?5000:20000); }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ sync(); loop(); } });
  window.addEventListener('hashchange',()=>loop());
  const pathOf=path=>{ const s=String(path).split('/'); return s[0]==='data'&&s[1]==='users'?['state',me.uid]:[s[0],s[1]]; };
  const db={
    doc(path){ const [c,id]=pathOf(path); return {
      async get(){ const j=await call('GET',`/doc?c=${encodeURIComponent(c)}&id=${encodeURIComponent(id)}`); return snapOf(id, j.exists?j.data:null); },
      async set(data){ const j=await call('PUT',`/doc?c=${encodeURIComponent(c)}&id=${encodeURIComponent(id)}`,{data}); if(c!=='state'&&put(c,id,clonePlain(data),j.u)) emitCol(c); },
      async acquire(o){ const j=await call('POST',`/lease?c=${encodeURIComponent(c)}&id=${encodeURIComponent(id)}&ttl=${(o&&o.ttlMs)||5000}`); return {acquired:!!j.acquired}; } }; },
    collection(c){ return { onSnapshot(cb){ (subs[c]||(subs[c]=[])).push(cb); if(synced) emitCol(c); return ()=>{ subs[c]=(subs[c]||[]).filter(x=>x!==cb); }; } }; }
  };
  const user={ id:async()=>me.uid, isOwner:async()=>!!me.owner };
  return { db, user, key:()=>key, call, async start(){ me=await call('GET','/me'); await sync(); loop(); return me; } };
}
async function connect(){
  let db=null, user=null;
  try{
    if(window.XLAND_SERVER){
      serverBE=serverBackend(); try{ await serverBE.start(); }catch(e){ toast(e.message||'The shared world is not reachable right now. You can still explore on this device.'); serverBE=null; return; }
      db=serverBE.db; user=serverBE.user; serverMode=true;
      if(lsGet(ADMIN_LS) && !(await user.isOwner())){ lsSet(ADMIN_LS,''); toast('The founder key was not accepted.'); }
    } else {
      let tries=0;
      while(!(window.claude && typeof window.claude.use==='function') && tries<20){ await new Promise(r=>setTimeout(r,300)); tries++; }
      if(!(window.claude && typeof window.claude.use==='function')) return;
      [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    }
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc('data/users/'+id+'/xland');
    const snap = await ref.get();
    const adopt = serverMode && lsGet('xland.adopt'); lsSet('xland.adopt','');
    remote = ref; accountLinked = true; socialInit(db, id, user);
    // Citizens who arrived before the world ledger existed: record their sandbox mint against the reserve (once per citizen)
    if(serverMode && state.passport && state.ledger.some(e=>e.op==='sandbox-grant')) serverBE.call('POST','/bux/sandbox').catch(()=>{});
    if(snap.exists && snap.data() && snap.data().state){
      const rs = migrate(JSON.parse(JSON.stringify(snap.data().state)));
      if(adopt || (rs.updatedAt||0) >= (state.updatedAt||0)){ state = rs; try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){} render(); }
      else save();
    } else if(state.passport){ save(); }
    if(serverMode){ setTimeout(walletSync, 400); setInterval(walletSync, 30000); }

function viewQuests(){
  const ST={LOCKED:'Locked',AVAILABLE:'Available',ACTIVE:'Active',BLOCKED:'Blocked',COMPLETED:'Completed',ARCHIVED:'Archived',EXPIRED:'Expired'};
  const ms=MISSIONS.map(m=>[m,missionState(m)]), active=ms.filter(x=>['ACTIVE','BLOCKED','COMPLETED'].includes(x[1])), avail=ms.filter(x=>x[1]==='AVAILABLE'), locked=ms.filter(x=>x[1]==='LOCKED'), done=ms.filter(x=>x[1]==='ARCHIVED');
  const evs=(state.worldEvents||[]).filter(e=>!e.outcome), dyn=(state.dyn||[]).filter(d=>!d.closed&&dynState(d)!=='EXPIRED');
  const place=m=>m.place&&PL[m.place]?`${esc(PL[m.place].name)}, ${esc(R[PL[m.place].region].name)}`:'Xland';
  const mcard=([m,st])=>{ const idx=m.stages.findIndex(s0=>!stageDone(state,s0)), cur=idx<0?null:m.stages[idx], blk=cur&&stageBlock(cur);
    return `<div class="mission glass ${st.toLowerCase()}"><div class="mhead"><span class="mstate ${st==='ACTIVE'?'voting':st==='COMPLETED'?'executed':st==='BLOCKED'?'rejected':''}">${ST[st]}</span><span class="meta">${esc(m.type)} · Issued by ${esc(m.issuer)}</span></div>
      <h3>${esc(m.title)}</h3><p class="meta">${esc(m.why)}</p>
      ${['ACTIVE','BLOCKED','COMPLETED','ARCHIVED'].includes(st)?`<ol class="stages-list">${m.stages.map((s0,k)=>{ const ok=stageDone(state,s0), br=state.branches&&state.branches[m.id+':'+k]; return `<li class="${ok?'ok':k===idx?'now':''}">${esc(stageLabel(s0))}${br?` <span class="meta">(chose ${esc(QBY[br.choice].title)})</span>`:''}</li>`; }).join('')}</ol>`:''}
      ${blk?`<div class="lawcard" style="margin:.4rem 0"><b>Blocked</b><p>${esc(blk)}</p></div>`:''}
      <p class="meta"><b>Consequence:</b> ${esc(m.consequence)} <b>Reward:</b> ${esc(REWARD_POLICIES[m.reward])}</p>
      <div class="btn-row">${st==='AVAILABLE'?`<button class="btn btn-quiet" data-act="m-accept" data-id="${m.id}">Accept mission</button>`:''}
        ${st==='ACTIVE'||st==='BLOCKED'?`<a class="btn btn-primary" href="${stageGo(cur)}">Go to ${esc(stageLabel(cur))}</a><button class="link link-muted" data-act="m-drop" data-id="${m.id}">Set aside</button>`:''}
        ${st==='COMPLETED'?`<button class="btn btn-gold" data-act="m-reward" data-id="${m.id}">Complete and record</button>`:''}
        ${st==='LOCKED'?`<span class="meta">${m.id!=='arrival'&&!state.passport?'Needs a passport.':'After: '+m.prereq.filter(id=>state.mstate[id]!=='rewarded').map(id=>esc(MBY[id].title)).join(', ')}</span>`:''}</div></div>`; };
  return `<section class="page fade-in">
    <div class="page-head"><div><h1 class="display">Journal</h1><p class="lede">Missions come from places, institutions and the state of the world. Follow up to ${MAX_ACTIVE} at once. Progress is verified from what actually happens; nothing is minted.</p></div><span class="meta">Issued at ${place({place:'hotex'})}</span></div>
    ${evs.length?`<h2 class="display eh">World events</h2><div class="quests">${evs.map(e=>{ const W=WEVENTS[e.id], ph=eventPhase(e), n=eventProgress(e); return `<div class="mission glass"><div class="mhead"><span class="mstate voting">${ph}</span><span class="meta">World event · ${esc(R[W.territory].name)}</span></div><h3>${esc(W.name)}</h3><p class="meta">${esc(W.effect)}</p><p><b>Objective:</b> ${esc(W.objective)}</p><div class="qbar"><span style="width:${Math.min(100,n/W.target*100)}%"></span></div><p class="meta">${n} of ${W.target}. ${ph==='ANNOUNCED'?'Begins':'Resolves'} at ${new Date(ph==='ANNOUNCED'?e.start:e.end).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}. Contributions are counted once each from your ledger.</p></div>`; }).join('')}</div>`:''}
    ${dyn.length?`<h2 class="display eh">Requests</h2><div class="quests">${dyn.map(d=>{ const st=dynState(d), n=dynProgress(d); return `<div class="mission glass"><div class="mhead"><span class="mstate ${st==='COMPLETED'?'executed':'voting'}">${ST[st]||st}</span><span class="meta">Generated from city demand ${d.snapshot.demand} · template ${d.tpl} v${d.version}</span></div><h3>City supply: ${AS[d.asset].sym}</h3><p class="meta">Issued by ${esc(DYN_TEMPLATES[d.tpl].issuer)}. Sell ${d.target} ${AS[d.asset].sym} at Forgex before ${fmtDate(d.expiresAt)}.</p>${st!=='AVAILABLE'?`<div class="qbar"><span style="width:${Math.min(100,n/d.target*100)}%"></span></div><p class="meta">${Math.min(n,d.target)} of ${d.target}</p>`:''}<div class="btn-row">${st==='AVAILABLE'?`<button class="btn btn-quiet" data-act="d-accept" data-id="${d.id}">Accept request</button>`:st==='COMPLETED'?`<button class="btn btn-gold" data-act="d-reward" data-id="${d.id}">Complete and record</button>`:`<a class="btn btn-primary" href="#/place/forgex">Go to Forgex</a>`}</div></div>`; }).join('')}</div>`:''}
    <h2 class="display eh">Active missions</h2>${active.length?`<div class="quests">${active.map(mcard).join('')}</div>`:'<p class="meta">No active missions. Accept one below.</p>'}
    ${avail.length?`<h2 class="display eh">Available</h2><div class="quests">${avail.map(mcard).join('')}</div>`:''}
    ${locked.length?`<h2 class="display eh">Locked</h2><div class="quests">${locked.map(mcard).join('')}</div>`:''}
    ${done.length?`<details class="archive"><summary class="display eh">Archive (${done.length})</summary><div class="quests">${done.map(mcard).join('')}</div></details>`:''}
  </section>`;
}

function runSelfTests(){
  const clone=()=>{ const c=JSON.parse(JSON.stringify(fresh())); c.passport=true; c.identity='guest'; grantSandbox(c); return c; };
  const T=[]; const t=(name,fn)=>{ try{ T.push([name, !!fn()]); }catch(e){ T.push([name,false]); } };
  t('Settlement is idempotent', ()=>{ const c=clone(); const a=postLedger(c,'t-1',[['bux',-UNIT]],'t'), b=postLedger(c,'t-1',[['bux',-UNIT]],'t'); return a&&!b&&c.bal.bux===String(BigInt(SIM.sandboxGrantBuX)*UNIT-UNIT); });
  t('Insufficient balance leaves no partial mutation', ()=>{ const c=clone(), before=c.bal.bux, n=c.ledger.length; return !postLedger(c,'t-2',[['vegiex',UNIT],['bux',-BigInt(10**9)*UNIT]],'t') && c.bal.bux===before && c.bal.vegiex==='0' && c.ledger.length===n; });
  t('Failed build returns reserved QuarX', ()=>{ const c=clone(); postLedger(c,'mine-t',[['quarx',3n*UNIT]],'t'); lockLedger(c,'build-lock-t','LOCK','quarx',3n*UNIT,'t'); const mid=c.bal.quarx==='0'&&c.locked.quarx===String(3n*UNIT); lockLedger(c,'build-unlock-t','UNLOCK','quarx',3n*UNIT,'t'); return mid&&c.bal.quarx===String(3n*UNIT)&&c.locked.quarx==='0'; });
  t('Committed build consumes only reserved QuarX', ()=>{ const c=clone(); postLedger(c,'mine-u',[['quarx',4n*UNIT]],'t'); lockLedger(c,'build-lock-u','LOCK','quarx',3n*UNIT,'t'); lockLedger(c,'build-consume-u','CONSUME','quarx',3n*UNIT,'t','consumed:test'); return c.bal.quarx===String(UNIT)&&c.locked.quarx==='0'; });
  t('Locked funds cannot be spent', ()=>{ const c=clone(); postLedger(c,'mine-v',[['quarx',2n*UNIT]],'t'); lockLedger(c,'build-lock-v','LOCK','quarx',2n*UNIT,'t'); return !postLedger(c,'swap-forgex-v',[['quarx',-UNIT]],'t'); });
  t('QuarX mining reward halves with each epoch and stops at the cap', ()=>{ const U=Number(UNIT); return seamRewardU(0)===U && seamRewardU(MINABLE_U*.5)===U/2 && seamRewardU(MINABLE_U*.75)===U/4 && seamRewardU(MINABLE_U)===0 && ECONOMY.genesis+MINABLE_U/U===ECONOMY.quarxCap; });
  t('Halvings come sooner as supply runs out, never past the cap', ()=>{ let m=0, last=0; for(let k=0;k<20;k++){ const n=nextHalvingAtU(m); if(n<=m||n>MINABLE_U) return false; last=n; m=n; } return last<=MINABLE_U; });
  t('Mining gets harder as more citizens mine', ()=>difficultyFor(0)===1 && difficultyFor(ECONOMY.targetMiners)===1 && Math.abs(difficultyFor(ECONOMY.targetMiners*2)-2)<1e-9 && difficultyFor(4000)>difficultyFor(2000));
  t('Difficulty holds total issuance near the daily seam target', ()=>{ const tot=m=>m*Math.min(ECONOMY.dailySeams, 86400/(ECONOMY.seamSecsBase*difficultyFor(m))); return tot(100)===500 && Math.abs(tot(1e6)-ECONOMY.targetSeamsPerDay)<1 && Math.abs(tot(1e7)-ECONOMY.targetSeamsPerDay)<1; });
  t('Shop and building costs halve with each halving', ()=>shopCostU('xetropolitan',Number(UNIT))===5n*UNIT && shopCostU('xetropolitan',Number(UNIT)/2)===5n*UNIT/2n && shopCostU('ixeland',Number(UNIT))===3n*UNIT/5n && quarxCostU(1,Number(UNIT)/4)===UNIT/4n);
  t('BuX enters only from the locked reserve', ()=>{ const c=clone(); const ins=c.ledger.filter(e=>e.asset==='bux'&&BigInt(e.delta)>0n&&e.event==='GRANT'); return ins.length>0 && ins.every(e=>e.from==='reserve:banx-locked') && !c.ledger.some(e=>e.to==='reserve:banx-locked'&&e.asset!=='bux'); });
  t('Tundrax endurance premium raises the floor with time held', ()=>{ const b=1000n*UNIT; return resaleFloor('tundrax',b,0)===b+UNIT && resaleFloor('tundrax',b,2*365.25*86400000)===b+80n*UNIT && resaleFloor('tundrax',b,20*365.25*86400000)===b+200n*UNIT && resaleFloor('ximberland',b,20*365.25*86400000)===b+UNIT; });
  t('Tundrax resale floor rejects below acquisition + 1 BuX', ()=>{ const c=clone(), basis=500n*UNIT; return !evaluate('tundrax','sell-home',{price:basis,basis},c).ok && evaluate('tundrax','sell-home',{price:basis+UNIT,basis},c).ok; });
  t('Ximberland resale floor rejects below acquisition + 1 BuX', ()=>{ const c=clone(), basis=400n*UNIT; return !evaluate('ximberland','sell-home',{price:basis,basis},c).ok && evaluate('ximberland','sell-home',{price:basis+UNIT,basis},c).ok; });
  t('Ximberland rejects a non-approved asset', ()=>!evaluate('ximberland','trade',{asset:'quarx'},clone()).ok && evaluate('ximberland','trade',{asset:'vegiex'},clone()).ok);
  t('Xetland and Xasteland stay locked', ()=>!evaluate('xetland','buy',{},clone()).ok && !evaluate('xasteland','buy',{},clone()).ok);
  t('Tundrax conversion requires home, two years and deposit', ()=>!evaluate('tundrax','convert',{ownsHome:true,ageOk:false,depositOk:true},clone()).ok && evaluate('tundrax','convert',{ownsHome:true,ageOk:true,depositOk:true},clone()).ok);
  t('Quest prerequisites gate later steps', ()=>{ const c=clone(); c.quests.passport='recorded'; return questState(QBY.build,c)==='locked' && questState(QBY.harvest,c)==='active'; });
  t('A route disruption doubles Forgex logistics for farm goods', ()=>{ const c=clone(); startEvent('road',c); const st0=state.worldEvents; return evMod('logisticsMult',1,c)===2 && evMod('logisticsMult',1,clone())===1; });
  t('A storm slows seams and lowers capacity', ()=>{ const c=clone(); startEvent('storm',c); return evMod('seamMult',1,c)===1.5 && evMod('capDelta',0,c)===-2; });
  t('Missions move LOCKED → AVAILABLE → ACTIVE → COMPLETED, and record once', ()=>{ const c=clone(); c.mstate={}; const a=missionState(MBY.home,c)==='LOCKED'; c.mstate.arrival='rewarded'; const b=missionState(MBY.home,c)==='AVAILABLE'; c.mstate.home='active'; const d=missionState(MBY.home,c)==='ACTIVE'; c.homes=[{region:'ximberland'}]; const e=missionState(MBY.home,c)==='COMPLETED'; c.mstate.home='rewarded'; return a&&b&&d&&e&&missionState(MBY.home,c)==='ARCHIVED'; });
  t('World-event contributions count once and resolve deterministically', ()=>{ const c=clone(); startEvent('storm',c,0); const e=c.worldEvents[0]; e.start=Date.now()-1000; postLedger(c,'mine-a',[['quarx',UNIT]],'t'); postLedger(c,'mine-b',[['quarx',UNIT]],'t'); e.end=Date.now(); const n=eventProgress(e,c); resolveEvents(c); return n===2 && e.outcome==='RESOLVED' && e.contribs.length===2; });
  t('Parcel acquisition is idempotent and cannot be double-sold', ()=>{ const c=clone(); c.currentRegion='farmx'; const a=acquireParcel(c,'FX-A-01').ok, b=acquireParcel(c,'FX-A-01').ok; return a && !b && c.rights.length===1 && parcelAvail(PBY['FX-A-01'],c)==='HELD'; });

function renderGuideInner(route){ const g=$('#guide'); if(!g) return; const s=state;
  if(!s.passport || ['hotex','founder'].includes(route) || (s.guide&&s.guide.hidden)){ g.innerHTML=''; return; }

  if(idx<0){ if(!(s.guide&&s.guide.finished)){ s.guide=Object.assign({},s.guide,{finished:true}); chron('FirstSteps','First steps in Xland complete','You read the land, worked it, traded, took a mission and read your passport.',null,'ordinary'); save(); toast('First steps complete. Xland is yours to explore.'); } g.innerHTML=''; return; }

    <h2 class="display eh">Testers</h2><div class="tbl"><table><thead><tr><th>Tester</th><th>State</th><th>Steps</th><th>Last seen</th><th>Where</th></tr></thead><tbody>${P.sort((a,b)=>b.updatedAt-a.updatedAt).map(x=>`<tr><td dir="auto">${esc(x.handle||'A tester')}</td><td>${esc(x.identity||'')}</td><td>${x.milestones?Object.values(x.milestones).filter(Boolean).length:0} of ${FUNNEL.length}</td><td>${fmtDate(x.updatedAt)}</td><td>${esc(x.route||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="meta">No testers yet.</td></tr>'}</tbody></table></div>

/* ---------------- Router ---------------- */
function parse(){ const h=(location.hash||'#/').slice(2).split('/'); return {route:h[0]||'home', arg:h[1]}; }
let lastRoute='', lastHTML='';
function render(){
  const {route,arg}=parse();
  if(resolveEvents()) save(); if(advanceProposals()) save(); if(syncSharedLaws()) save(); if(applySpoilage()) save(); if(applyIdleFees()) save(); recordBranches(); generateMissions();
  checkAchievements();
  renderChrome(route==='home'?'':route);
  if(route==='profile' && state.passport && !state.seenPassport){ state.seenPassport=true; save(); }
  let html='';
  switch(route){
    case 'hotex': html=viewHotex(); break;
    case 'world': html=viewWorld(); break;
    case 'region': html=viewRegion(arg); if(R[arg]){ let ch=false; if(!state.inspected.includes(arg)){state.inspected.push(arg);ch=true;} if(!state.read.includes(arg)){state.read.push(arg);ch=true;} if(ch) save(); } break;
    case 'quests': html=viewQuests(); break;
    case 'chronicle': html=viewChronicle(); break;
    case 'profile': html=viewProfile(); break;
    case 'wallet': html=viewWallet(); break;
    case 'economy': html=viewEconomy(); break;
    case 'tests': html=viewTests(); break;
    case 'founder': html=viewFounder(); break;
    case 'place': html=viewPlace(arg); break;
    case 'parcel': html=viewParcel(arg); break;
    default: html=viewLanding();
  }
  const key=route+'/'+(arg||''), app=$('#app');
  // Shared-world updates re-render often: leave the page alone when nothing changed (keeps clicks, inputs and the
  // 3D scene intact), and do not replay the entrance animation when the same page is redrawn.
  if(key===lastRoute && html===lastHTML && app.childElementCount){ renderGuide(route); return; }
  app.classList.toggle('no-anim', key===lastRoute);
  app.innerHTML=html; lastHTML=html;
  if(worldPage(route,arg) && (!world || Date.now()-(world.at||0)>15000)) refreshWorld();
  mountScene();
  renderGuide(route);
  if(key!==lastRoute){ window.scrollTo(0,0); lastRoute=key; }
  if(route==='hotex' && hx.step===2){ const i=$('#hx-handle'); if(i) i.focus(); }
}
window.addEventListener('hashchange', ()=>{ resetArmed=false; render(); });

function mountScene(){
  const h=document.querySelector('#app [data-scene]'); if(!h) return;
  const m=h.dataset.scene, small=window.matchMedia('(max-width:820px)').matches;
  const fallback = el => { el.classList.add('flat'); el.innerHTML = renderMap(m==='world'?{mode:'full',selected:ui.selected,deps:ui.deps}:m==='region'?{mode:'mini',highlight:h.dataset.focus}:{mode:'backdrop'}); };
  XW.setUserObjects(userObjects()); XW.setRegionNotes(regionNotes()); XW.setWorld({storm:activeEvents().some(e=>e.id==='storm'), routes:activeEvents().map(e=>WEVENTS[e.id].route).filter(Boolean)}); XW.setBurn(Math.log10(1+Number(burnedBuX()))/3);
  const ok = XW.attach(h,{mode:m, focus:h.dataset.focus, selected:m==='world'?ui.selected:null, place:m==='world'?ui.place:(h.dataset.place||null), point:h.dataset.point?h.dataset.point.split(',').map(Number):null, deps:ui.deps,
    shift: m==='world'&&!small ? 412/Math.max(900,window.innerWidth) : (m==='backdrop'&&!small ? -.46 : 0),
    onSelect: id=>{ if(id) select(id); }, onPlace: pid=>selectPlace(pid), fallback});
  if(!ok) fallback(h);
  requestAnimationFrame(()=>{ const c=document.getElementById('scard'); XW.setInset(c&&!c.hidden&&small?c.offsetHeight+16:0); });
}

/* Every open citizen shop stands on the shared map near its market: a stall with a coloured awning, one per cooperative. */
const SHOP_TINT = { xetropolitan:[.85,.62,.3], farmx:[.55,.72,.3], ximberland:[.3,.62,.42], xalp:[.62,.7,.82], tundrax:[.78,.86,.92], ixeland:[.55,.78,.95], xahara:[.92,.7,.38] };
const hashN = str => { let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967296; };
function shopObjects(){ const now=Date.now(), out=[], seen=new Set(), per={};
  const all=Object.entries(social.shops||{}).filter(([id,sh])=>sh && sh.openUntil>now && SHOP_TERR[sh.t||'xetropolitan'] && !SHOP_TERR[sh.t||'xetropolitan'].soon);
  if(state.shop && social.me && !all.some(([id])=>id===social.me)) all.push([social.me,{name:state.shop.name, t:shopT(state), coop:state.shop.coop||null}]);
  all.sort((a,b)=>(a[1].at||0)-(b[1].at||0)).forEach(([id,sh])=>{ const t=sh.t||'xetropolitan', c=SHOP_TERR[t], key=sh.coop?'coop-'+sh.coop:id; if(seen.has(key)) return; seen.add(key);
    if((per[t]=(per[t]||0)+1)>24) return; const anchor=(PL[c.market||c.place]||{}).at; if(!anchor) return;
    const h=hashN(key), ang=h*Math.PI*2, rad=30+((h*997)%1)*15, mine=id===social.me||(sh.coop&&state.shop&&state.shop.coop===sh.coop);
    const name=sh.coop&&market.coops[sh.coop]?market.coops[sh.coop].name:sh.name;
    out.push({id:'s-'+key.replace(/[^A-Za-z0-9_-]/g,''), kind:'shop', label:mine?`Your ${c.kind.toLowerCase()} · ${name}`:name, region:t, at:[anchor[0]+Math.cos(ang)*rad, anchor[1]+Math.sin(ang)*rad], place:c.market||c.place, rot:h*3, tint:SHOP_TINT[t], mine}); });
  return out; }
function userObjects(){
  const list=shopObjects();
  (state.rights||[]).filter(r=>r.status==='active').forEach(r=>{ const pp=PBY[r.parcel]; list.push({parcel:pp.id, id:'parcel-'+pp.id, kind:pp.building==='homax'?'homax':'parcel', label:pp.building==='homax'?`Your Homax ${pp.id}`:`Your parcel ${pp.id}`, region:pp.t, at:pp.at, place:''}); });
  state.buildings.forEach(b=>{ const pp=PBY[b.parcel]; list.push({id:'bld-'+b.parcel, kind:'farmstead', label:`Farmstead ${b.parcel}`, region:pp.t, at:[pp.at[0]+6,pp.at[1]+4], place:'fields'}); });
  state.projects.filter(x=>x.status==='active').forEach(x=>{ const pp=PBY[x.parcel], f=Math.min(1,(Date.now()-x.start)/(x.end-x.start)); list.push({parcel:x.parcel, id:'proj-'+x.parcel, kind:'scaffold', h:.4+f*1.6, label:'Farmstead under construction', region:pp.t, at:[pp.at[0]+6,pp.at[1]+4], place:''}); });
  if(social.db){ social.citizens.filter(c=>c.id!==social.me).forEach(c=>(c.structures||[]).forEach((st,i)=>{ if(!st||!st.at||!['homax','farmstead'].includes(st.kind)) return;
    list.push({id:'o-'+c.id.slice(-6)+'-'+i, kind:st.kind, label:`${citizenName(c)}'s ${st.kind==='homax'?'Homax':'Farmstead'}`, region:st.t||'', at:st.at, place:'', parcel:st.kind==='homax'?st.parcel:''}); })); }
  if(state.parcelFocus && !rightFor(state,state.parcelFocus) && location.hash.startsWith('#/parcel/')){ const pp=PBY[state.parcelFocus]; list.push({parcel:pp.id, id:'focus', kind:'parcel', label:`Parcel ${pp.id}`, region:pp.t, at:pp.at, place:''}); }
  PARCELS.forEach(pp=>{ if(rightFor(state,pp.id) || state.parcelFocus===pp.id) return; const av=parcelAvail(pp), cl=social.claims[pp.id];
    if(av==='AVAILABLE') list.push({id:'p-'+pp.id, kind:'forsale', parcel:pp.id, label:`For sale · ${pp.price} BuX`, region:pp.t, at:pp.at, place:''});
    else if(av==='HELD' && cl && cl.owner && cl.owner!==social.me && !list.some(u=>u.parcel===pp.id)) list.push({id:'p-'+pp.id, kind:'held', parcel:pp.id, label:cl.handle?`${cl.handle}'s land`:'Held land', region:pp.t, at:pp.at, place:''}); });
  if(state.builds.length) list.push({id:'monument', kind:'monument', label:state.builds[0].name, region:'xetropolitan', at:PL.civicsite.at, place:'civicsite'});
  else if(state.construct){ const c=state.construct, f=Math.min(1,(Date.now()-c.start)/(c.end-c.start)); list.push({id:'scaffold', kind:'scaffold', h:.6+f*3.4, label:'Under construction', region:'xetropolitan', at:PL.civicsite.at, place:'civicsite'}); }
  return list;
}

/* ---------------- Gameplay ---------------- */
const opId = p => p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function parseAmt(str){ const m=String(str||'').trim().match(/^(\d{1,12})(?:\.(\d{1,4}))?$/); if(!m) return null; return BigInt(m[1])*UNIT + BigInt((m[2]||'').padEnd(4,'0')); }
const secsLeft = end => Math.max(0,Math.ceil((end-Date.now())/1000));
const fmtSecs = s => s>=60?`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`:`${s}s`;
function here(region){ return state.passport && state.currentRegion===region; }
function presence(region){
  if(!state.passport) return `<div class="gate"><p>You need a passport before you can act here.</p><a class="btn btn-primary" href="#/hotex">Enter through Hotex</a></div>`;
  if(state.currentRegion!==region) return `<div class="gate"><p>This activity happens in ${esc(R[region].name)}. You are in ${state.currentRegion?esc(R[state.currentRegion].name):'Hotex'}.</p><button class="btn btn-primary" data-act="travel" data-id="${region}">Travel to ${esc(R[region].name)}</button></div>`;
  return '';
}
function timerBar(start,end,label){ const pct=Math.min(100,Math.max(0,(Date.now()-start)/(end-start)*100));
  return `<div class="timer" data-start="${start}" data-end="${end}"><div class="tbar"><span style="width:${pct.toFixed(1)}%"></span></div><p class="meta"><span class="tleft">${fmtSecs(secsLeft(end))}</span> left. ${esc(label)}</p></div>`; }
const expTag = '<span class="tag tag-prov">Simulation parameter</span>';

  }
}

/* ---------------- Population: 21,000,000 citizens, opened in stages ----------------
   Founder decision: Xland holds 21,000,000 residents in all. Each territory has a fixed share; the dense city houses
   the most in apartments and towers, harsh lands the fewest. Nothing opens at once: homes open in five stages, and the
   next stage opens only when 90% of the current one is lived in. The two reserves open last: Xetland after its ten-year
   lock, Xasteland when 90% of all open homes are lived in. Aquax is not counted: it holds one eternal residence. */
const POP = { total:21000000, gateFill:0.9, stages:[0.01,0.05,0.2,0.5,1],
  share:{ xetropolitan:.40, farmx:.12, ximberland:.12, xalp:.08, ixeland:.07, xahara:.06, tundrax:.01, xetland:.07, xasteland:.07 },
  housing:{ xetropolitan:'Apartments and towers', farmx:'Farmsteads', ximberland:'Homax houses', xalp:'Mountain lodges', ixeland:'Domes', xahara:'Nomad tents', tundrax:'Scarce homes', xetland:'Reserved homes', xasteland:'Reserved frontier' },
  reserve:['xetland','xasteland'] };
const POP_OPEN = Object.keys(POP.share).filter(t=>!POP.reserve.includes(t));
const popOpenTotal = () => Math.round(POP.total*POP_OPEN.reduce((a,t)=>a+POP.share[t],0));   // 18,060,000
const popFull = t => Math.round(POP.total*POP.share[t]);
const capacityAt = (t, k) => Math.round(POP.total*POP.share[t]*POP.stages[k]);
const openResidents = res => POP_OPEN.reduce((a,t)=>a+(res[t]||0),0);
/* Stage index (0-based): advances while the open territories together have filled 90% of the current stage. */
function popStage(res){ const n=openResidents(res||{}); let k=0; while(k<POP.stages.length-1 && n>=POP.gateFill*popOpenTotal()*POP.stages[k]) k++; return k; }
const xastelandThreshold = () => Math.round(POP.gateFill*popOpenTotal());   // 16,254,000
const xastelandOpens = res => openResidents(res||{}) >= xastelandThreshold();
function roomIn(t, res){ if(POP.share[t]==null || POP.reserve.includes(t)) return 0; return capacityAt(t,popStage(res))-((res||{})[t]||0); }
/* Residents: one per citizen per territory where they hold land rights (shared registry plus this device). */
function residentsNow(){ const by={}, seen={}, add=(t,who)=>{ const k=t+':'+who; if(seen[k]) return; seen[k]=1; by[t]=(by[t]||0)+1; };
  Object.entries(social.claims||{}).forEach(([pid,c])=>{ const pp=PBY[pid]; if(pp && c && c.owner) add(pp.t,c.owner); });
  (state.rights||[]).filter(r=>r.status==='active').forEach(r=>{ const pp=PBY[r.parcel]; if(pp) add(pp.t,social.me||'me'); });
  return by; }

    case 'title': state.title=b.dataset.v||null; if(state.title) emit('TITLE_GRANTED',{id:state.title}); save(); render(); break;
    case 'law': { const out=$('#law-out'); if(out) out.innerHTML=lawBlock(id); break; }
    case 'reset':
      if(!resetArmed){ resetArmed=true; render(); return; }
      resetArmed=false; state=fresh(); save(); ui.selected=null; location.hash='#/'; render(); toast('Prototype data erased.'); break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='fc-price'||e.target.id==='fc-years'){ const o=$('#fc-out'); if(o) o.textContent=floorText($('#fc-price').value,$('#fc-years').value); }
  if(e.target.id==='sw-amt' && ui.swap){ ui.swap.amount=e.target.value; ui.swap.quotedAt=Date.now(); const qd=$('#sw-quote'); if(qd) qd.innerHTML=quoteHTML(ui.swap.venue); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='sw-asset' && ui.swap){ ui.swap.asset=e.target.value; ui.swap.op=opId('swap-'+ui.swap.venue); const a=$('#activity'); if(a) a.innerHTML=activity(PL[ui.swap.venue]); }
});
document.addEventListener('keydown', e=>{
  const el=e.target.closest && e.target.closest('.map-full [data-region]');
  if(el && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); select(el.dataset.region); }
  if(e.target.id==='hx-handle' && e.key==='Enter'){ e.preventDefault(); const btn=document.querySelector('[data-act="hx-name"]'); if(btn) btn.click(); }
});

render();
connect();
setTimeout(()=>{ let seen=state.introSeen; try{ seen=seen||localStorage.getItem('xland.introSeen'); }catch(e){} if(!seen && !state.passport && (location.hash===''||location.hash==='#/')) showIntro(); },900);
setTimeout(()=>{ rollDailyEvent(); },2600);
setTimeout(()=>{ if(!state.passport) return; const gone=Date.now()-(state.lastSeen||0), ready=[];
  if(state.plot&&Date.now()>=state.plot.end) ready.push('a harvest is ready in FarmX'); if(state.mine&&Date.now()>=state.mine.end) ready.push('QuarX is ready in Xalp'); if(state.construct&&Date.now()>=state.construct.end) ready.push('your construction is complete');
  if(gone>10*60000 || ready.length) toast(`Welcome back, ${state.handle}.${ready.length?' '+ready.join('; ')+'.':''}`); state.lastSeen=Date.now(); save(); },1400);
setInterval(()=>{
  document.querySelectorAll('.timer').forEach(t=>{ const st=+t.dataset.start, en=+t.dataset.end; const pct=Math.min(100,(Date.now()-st)/(en-st)*100);
    const b=t.querySelector('.tbar span'); if(b) b.style.width=pct.toFixed(1)+'%'; const l=t.querySelector('.tleft'); if(l) l.textContent=fmtSecs(secsLeft(en));
    if(Date.now()>=en && !t.dataset.done){ t.dataset.done='1'; const a=$('#activity'), {route,arg}=parse(); if(a && route==='place') a.innerHTML=activity(PL[arg]); } });
  if(advanceProposals()){ save(); const {route,arg}=parse(); if(route==='place'&&arg==='complex'){ const a=$('#activity'); if(a) a.innerHTML=activity(PL.complex); } }
  state.projects.filter(x=>x.status==='active'&&!x.committed&&Date.now()>=x.commitAt&&!x.committing).forEach(x=>{ const commit=()=>{ x.committing=false; projectCommit(state,x); emit('BUILD_COMMITTED',{parcel:x.parcel}); save(); toast('Foundation complete: resources committed.'); };
    if(x.server){ x.committing=true; srvBuild('/build/commit?key='+encodeURIComponent(x.key)).then(commit).catch(()=>{ x.committing=false; }); } else commit(); });
  [['plot','Harvest ready at the FarmX fields.'],['mine','QuarX ready to collect in Xalp.'],['construct','Construction complete in the Civic plaza.']].forEach(([k,msg])=>{
    const o=state[k]; if(o && Date.now()>=o.end && !state.notified[o.op]){ state.notified[o.op]=1; toast(msg); } });
},1000);
/* Test hook for the local test scripts only (test/*.cjs); absent on xland.world. */
if(location.hostname==='localhost') window.__xl={ get state(){ return state; }, postLedger, save, fmtAmt, reconcile, social, UNIT, XW,
  // gives this citizen produce (vegiex, livestox) or QuarX on the local test server, as if harvested or mined
  async devCredit(asset, whole){ const op=(asset==='quarx'?'mine-dev-':'prod-dev-')+Date.now().toString(36)+Math.random().toString(36).slice(2,5), units=BigInt(whole)*UNIT;
    await serverBE.call('POST',`/dev/credit?asset=${asset}&units=${units}&op=${op}`); postLedger(state,op,[[asset,units]],'Test credit','test'); save(); return op; } };
})();
</script>
