<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme:dark">
<head>
<script>window.XLAND_SERVER=1;try{var t=localStorage.getItem("xland.theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t}}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F7; --bg-2:#E2E8F1; --surface:rgba(255,255,255,.74); --surface-strong:rgba(255,255,255,.92);
  --line:rgba(22,40,80,.12); --line-strong:rgba(22,40,80,.24); --edge:rgba(255,255,255,.9);
  --text:#0F1830; --muted:#4A5672; --faint:#7A86A0;
  --cyan:#0B8EA4; --blue:#2463D6; --gold:#9A7330; --gold-soft:rgba(154,115,48,.14); --warn:#B4583E;
  --cta-ink:#FFFFFF; --sea:#D9E2EE; --graticule:rgba(36,99,214,.07);
  --cell-s:26%; --cell-l:80%; --contour:rgba(20,44,90,.10); --cell-border:rgba(28,58,110,.32);
  --coast:rgba(11,142,164,.55); --label:#0F1830; --label-halo:rgba(237,241,247,.9);
  --shadow:rgba(20,40,90,.22);
  --font-display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --top:64px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050913; --bg-2:#0A1124; --surface:rgba(13,21,42,.64); --surface-strong:rgba(14,22,44,.92);
    --line:rgba(150,185,240,.11); --line-strong:rgba(150,185,240,.22); --edge:rgba(190,220,255,.07);
    --text:#E7ECF5; --muted:#93A0BA; --faint:#5E6A86;
    --cyan:#67D8E9; --blue:#4A8DFF; --gold:#D8BA7C; --gold-soft:rgba(216,186,124,.12); --warn:#E39377;
    --cta-ink:#04101F; --sea:#060B19; --graticule:rgba(103,216,233,.045);
    --cell-s:26%; --cell-l:15%; --contour:rgba(200,225,255,.075); --cell-border:rgba(150,195,245,.26);
    --coast:rgba(103,216,233,.5); --label:#EAF0FA; --label-halo:rgba(5,9,19,.85);
    --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#050913; --bg-2:#0A1124; --surface:rgba(13,21,42,.64); --surface-strong:rgba(14,22,44,.92);
  --line:rgba(150,185,240,.11); --line-strong:rgba(150,185,240,.22); --edge:rgba(190,220,255,.07);
  --text:#E7ECF5; --muted:#93A0BA; --faint:#5E6A86;
  --cyan:#67D8E9; --blue:#4A8DFF; --gold:#D8BA7C; --gold-soft:rgba(216,186,124,.12); --warn:#E39377;
  --cta-ink:#04101F; --sea:#060B19; --graticule:rgba(103,216,233,.045);
  --cell-s:26%; --cell-l:15%; --contour:rgba(200,225,255,.075); --cell-border:rgba(150,195,245,.26);
  --coast:rgba(103,216,233,.5); --label:#EAF0FA; --label-halo:rgba(5,9,19,.85);
  --shadow:rgba(0,0,0,.6);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Type */
.display{font-family:var(--font-display);font-weight:500;letter-spacing:-.012em;line-height:1.02;font-optical-sizing:auto}
h1,h2,h3{margin:0;font-weight:500}
h1.display{font-size:clamp(2.5rem,6.4vw,5.4rem)}
h2.display{font-size:clamp(1.8rem,3.4vw,2.6rem)}
h3{font-size:1.02rem;font-weight:600;letter-spacing:.005em}
p{margin:0}
.lede{font-size:clamp(1.05rem,1.6vw,1.22rem);color:var(--muted);max-width:56ch;line-height:1.6}
.meta{font-size:.84rem;color:var(--muted)}
.faint{color:var(--faint)}

/* Surfaces */
.glass{background:var(--surface);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 var(--edge),0 30px 70px -34px var(--shadow)}

/* Buttons: chamfered cut-glass tablets */
.btn{--cut:11px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:46px;padding:.7rem 1.4rem;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:.95rem;letter-spacing:.015em;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:transform .25s var(--ease),filter .25s var(--ease);overflow:hidden;white-space:nowrap}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 48%,transparent 66%);transform:translateX(-120%);transition:transform .8s var(--ease);pointer-events:none}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:var(--cta-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.18)}
.btn-gold{background:linear-gradient(135deg,#F0D9A4,#B98C3E);color:#1C1405;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.2)}
.btn-quiet{background:var(--surface-strong);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn[disabled]{cursor:not-allowed;filter:grayscale(.8) opacity(.45)}
.btn[disabled]::after{display:none}
.link{background:none;border:0;padding:.2rem 0;cursor:pointer;color:var(--text);font-weight:500;text-decoration:none;background-image:linear-gradient(var(--cyan),var(--cyan));background-size:0% 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .35s var(--ease)}
.link:hover{background-size:100% 1px}
.link-muted{color:var(--muted)}
.btn-row{display:flex;flex-wrap:wrap;gap:.9rem 1.4rem;align-items:center}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.24rem .6rem .26rem .5rem;font-size:.78rem;font-weight:500;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;line-height:1.3;white-space:nowrap}
.chip svg{width:12px;height:12px;flex:none}
.chip.st-open{color:var(--cyan)}
.chip.st-restricted{color:var(--blue)}
.chip.st-locked{color:var(--warn)}
.chip.st-mythic{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tag{display:inline-block;margin-left:.45rem;padding:.05rem .4rem;font-size:.7rem;font-weight:600;border-radius:2px;vertical-align:.08em;letter-spacing:.01em}
.tag-prov{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.tag-tbd{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.tag-sim{color:var(--gold);background:var(--gold-soft)}

/* Top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.topbar-inner{height:var(--top);display:flex;align-items:center;gap:2rem;padding:0 clamp(1rem,3vw,2.2rem);background:linear-gradient(to bottom,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 70%,transparent 100%)}
.wordmark{font-family:var(--font-display);font-size:1.7rem;font-weight:600;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:.55rem}
.wordmark svg{width:20px;height:20px;color:var(--cyan)}
.nav{display:flex;gap:.3rem;margin-left:auto}
.nav a{position:relative;padding:.55rem .95rem;text-decoration:none;font-size:.92rem;font-weight:500;color:var(--muted);transition:color .25s}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:.1rem;width:6px;height:6px;background:var(--cyan);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 10px var(--cyan)}
.who{display:flex;align-items:center;gap:.65rem;font-size:.86rem;color:var(--muted);text-decoration:none}
.who .sigil{width:30px;height:30px;display:grid;place-items:center;font-family:var(--font-display);font-size:1rem;color:var(--text);border:1px solid var(--line-strong);transform:rotate(45deg)}
.who .sigil span{transform:rotate(-45deg)}
.who b{color:var(--text);font-weight:600}
.dock{display:none}

main{padding-top:calc(var(--top) + env(safe-area-inset-top,0px))}
.page{max-width:1180px;margin:0 auto;padding:clamp(1.5rem,4vw,3.5rem) clamp(1.1rem,4vw,2.5rem) 5rem}

/* Map */
.map{display:block;width:100%;height:100%}
.map .cell{fill:hsl(var(--h) var(--cell-s) calc(var(--cell-l) + var(--dl,0%)));stroke:var(--cell-border);stroke-width:1.2;transition:fill .35s var(--ease)}
.map .locked .cell{fill:hsl(var(--h) 6% calc(var(--cell-l) - 2%))}
.map .contour{fill:none;stroke:var(--contour);stroke-width:1.1}
.map .region{cursor:pointer;outline:none}
.map-full .region:hover .cell,.map-full .region:focus-visible .cell{fill:hsl(var(--h) calc(var(--cell-s) + 14%) calc(var(--cell-l) + var(--dl,0%) + 6%))}
.map .region.sel .cell{stroke:var(--cyan);stroke-width:3}
.map .region.dim .cell{fill:hsl(var(--h) 4% var(--cell-l));opacity:.55}
.map .region.hi .cell{stroke:var(--cyan);stroke-width:3.4;fill:hsl(var(--h) calc(var(--cell-s) + 18%) calc(var(--cell-l) + var(--dl,0%) + 8%))}
.map .coast-halo{fill:none;stroke:var(--coast);stroke-width:14;opacity:.12}
.map .coast-line{fill:none;stroke:var(--coast);stroke-width:1.6}
.map .river-glow{fill:none;stroke:var(--gold);stroke-width:12;opacity:.16;stroke-linecap:round}
.map .river{fill:none;stroke:var(--gold);stroke-width:3.2;stroke-linecap:round;opacity:.9}
.map .river-hit{fill:none;stroke:transparent;stroke-width:30;stroke-linecap:round;pointer-events:stroke}
.map .region.sel .river,.map .region.hi .river{stroke-width:5}
.map .house{fill:var(--gold)}
.map .house-ring{fill:none;stroke:var(--gold);stroke-width:1.4;opacity:.7}
.map .lbl{pointer-events:none;paint-order:stroke;stroke:var(--label-halo);stroke-width:5px;stroke-linejoin:round}
.map .lbl-name{font-family:var(--font-display);font-size:23px;font-weight:600;fill:var(--label);letter-spacing:-.01em}
.map .lbl-sub{font-family:var(--font-ui);font-size:13px;fill:var(--muted);font-weight:500}
.map .lbl-gold{fill:var(--gold)}
.map .lock-ico{fill:none;stroke:var(--warn);stroke-width:2}
.map .dep{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-dasharray:7 7;animation:flow 1.6s linear infinite;opacity:.9}
.map .dep.future{stroke:var(--faint);stroke-dasharray:2 7;animation:none}
.map .dep-head{fill:var(--cyan)}
@keyframes flow{to{stroke-dashoffset:-28}}

.map-mini .lbl-name{font-size:44px}
.map-mini .lbl-sub{font-size:24px}
.map-mini .lbl{stroke-width:9px}
@media (max-width:820px){
  .map-full .lbl-name{font-size:32px}
  .map-full .lbl-sub{display:none}
  .map .lbl{stroke-width:7px}
}

/* 3D scene */
.scene{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#14223f 0%,#0b1428 55%,#070d1c 100%)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene > svg.map{position:absolute;inset:0}
.scene-labels{position:absolute;inset:0;pointer-events:none}
.scene-arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.scene-arcs .arc{fill:none;stroke:#67D8E9;stroke-width:1.8;stroke-dasharray:6 6;animation:flow 1.6s linear infinite;filter:drop-shadow(0 0 4px rgba(103,216,233,.7))}
.scene-arcs .arc.future{stroke:#8E9AB2;stroke-dasharray:2 6;animation:none;filter:none}
.tl{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:.35rem .6rem;min-height:34px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;color:#EEF3FB;text-align:center;white-space:nowrap;will-change:transform;transition:opacity .3s}
.tl b{display:block;font-family:var(--font-display);font-size:1.12rem;font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 16px rgba(3,8,20,.95)}
.tl span{display:block;font-size:.7rem;font-weight:500;color:#B5C1D8;text-shadow:0 1px 6px rgba(0,0,0,.95)}
.tl::after{content:"";display:block;width:1px;height:14px;margin:.2rem auto 0;background:linear-gradient(rgba(234,240,250,.7),transparent)}
.tl.sel b{color:#9BEAF5}
.tl.sel::after{background:linear-gradient(#67D8E9,transparent);height:20px}
.tl.locked b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:.4rem;border:1.4px solid #E39377;vertical-align:.12em}
.tl.mythic b{color:#E8C98A}
.tl.hide{opacity:0;pointer-events:none}
.tl:focus-visible{outline:2px solid #67D8E9;outline-offset:2px}
.scene-veil{position:absolute;inset:0;display:grid;place-items:center;color:#93A0BA;font-size:.9rem;letter-spacing:.02em;animation:fadeIn .4s}
div.tl{cursor:default}
.tl.dimmed{opacity:.88}
.tl{z-index:4}
.tl.edge{opacity:.95}
.tl.edge{background:rgba(8,14,30,.62);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(150,185,240,.28)}
.tl.dimmed b{font-size:.95rem}
.pl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:.4rem;padding:.24rem .55rem .26rem .45rem;font:500 .74rem/1.2 var(--font-ui);color:#E7ECF5;background:rgba(8,14,30,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(150,185,240,.2);border-radius:3px;white-space:nowrap;cursor:pointer;transition:opacity .3s,border-color .2s;will-change:transform}
.pl i{width:6px;height:6px;transform:rotate(45deg);background:var(--c,#67D8E9);flex:none;box-shadow:0 0 6px var(--c,#67D8E9)}
.pl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:linear-gradient(rgba(234,240,250,.6),transparent)}
.pl:hover{border-color:var(--c,#67D8E9)}
.pl.sel{border-color:#67D8E9;color:#9BEAF5;box-shadow:0 0 16px rgba(103,216,233,.4);z-index:2}
.pl.hide{opacity:0;pointer-events:none}
div.pl{cursor:default}
.pl.founder{color:#E9DCC0;border-color:rgba(232,201,138,.3);background:rgba(14,12,8,.7);font-size:.68rem;font-style:italic;padding:.15rem .45rem .17rem .38rem;z-index:3}
.pl.mine{color:#D9F6FB;border-color:rgba(103,216,233,.6);background:rgba(6,24,32,.8);z-index:3}
.pl.mine i{background:#67D8E9}
.pl.founder i{background:#E8C98A;box-shadow:0 0 8px #E8C98A}
.pl.founder::after{background:linear-gradient(rgba(232,201,138,.8),transparent)}
.tabs{display:flex;gap:1.4rem;margin:1rem 0 .2rem;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:.55rem 0;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--cyan)}
.pgroup{margin-top:1.2rem}
.pgroup h3{font-family:var(--font-display);font-size:1.15rem;font-weight:500;margin-bottom:.3rem}
.plist{list-style:none;margin:0;padding:0}
.plist button{width:100%;display:grid;grid-template-columns:12px 1fr;gap:.1rem .7rem;align-items:baseline;padding:.6rem .1rem;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:var(--text)}
.plist button:hover b{color:var(--cyan)}
.plist i{width:7px;height:7px;transform:rotate(45deg);background:var(--c)}
.plist b{font-weight:600;font-size:.94rem;transition:color .2s}
.plist span{grid-column:2;font-size:.8rem;color:var(--muted)}
.dist-tag{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--muted)}
.dist-tag i{width:7px;height:7px;transform:rotate(45deg);background:var(--c)}

.stage-wrap{position:absolute;inset:0}
.rail,.scard{display:none}
.scard .sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.sc-name{display:block;font-family:var(--font-display);font-size:1.7rem;font-weight:500;line-height:1.1}
.sc-head span{font-size:.8rem;color:#A9B6CE}
.sc-role{font-family:var(--font-display);font-style:italic;font-size:.98rem;line-height:1.45;color:#C9D3E6;margin:.6rem 0 .9rem}
.sc-desc{font-size:.86rem;line-height:1.45;color:#C9D3E6;margin:.55rem 0 .2rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc-link{background:none;border:0;color:#C9D3E6;font-weight:500;cursor:pointer;padding:.3rem 0}
.scard .chip.st-open{color:#67D8E9}.scard .chip.st-restricted{color:#7FA9FF}.scard .chip.st-locked{color:#E39377}.scard .chip.st-mythic{color:#D8BA7C}
.scard .chip{border-color:rgba(150,185,240,.25)}
@media (max-width:820px){
  .stage-wrap{position:relative;inset:auto}
  .rail{display:flex;gap:.4rem;position:absolute;top:.6rem;left:0;right:0;z-index:4;overflow-x:auto;padding:0 .8rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .rail button{--cut:7px;flex:none;touch-action:manipulation;padding:.5rem .85rem;font-size:.84rem;font-weight:500;color:#DCE4F2;background:rgba(9,16,33,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:0;cursor:pointer;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .rail button[aria-current="true"]{color:#F2FDFF;background:linear-gradient(180deg,rgba(103,216,233,.4),rgba(103,216,233,.16));box-shadow:inset 0 0 0 1px rgba(103,216,233,.8),inset 0 -12px 20px -14px #67D8E9;text-shadow:0 0 12px rgba(103,216,233,.6);font-weight:600}
  .scard{display:block;position:absolute;left:.7rem;right:.7rem;bottom:.7rem;z-index:4;padding:1rem 1.1rem 1.05rem;color:#E7ECF5;background:rgba(9,16,33,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(150,185,240,.16);border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
  .scard[hidden]{display:none}
  .scard.pop{animation:panelUp .45s var(--ease)}
  .scard .sc-role{display:none}
  .scard .btn-row{margin-top:.8rem}
  .scard .sc-name{font-size:1.45rem}
  .map-tools .link{display:none}
}
@keyframes panelUp{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* Landing */
.hero{position:relative;min-height:calc(100svh - var(--top));display:grid;align-items:center;overflow:hidden;margin-top:calc(-1 * var(--top));padding-top:var(--top)}
.hero-map{position:absolute;inset:0;opacity:1;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 38%);mask-image:linear-gradient(90deg,transparent 0%,#000 38%)}
.hero-map .map{position:absolute;inset:0}
.hero-map.scene{background:none}
.hero-copy{position:relative;max-width:1180px;width:100%;margin:0 auto;padding:3rem clamp(1.1rem,4vw,2.5rem)}
.hero-copy h1{max-width:12ch;margin-bottom:1.6rem}
.hero-copy .lede{margin-bottom:2.4rem}
.hero-veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,color-mix(in srgb,var(--bg) 60%,transparent) 45%,transparent 75%)}
.band{border-top:1px solid var(--line)}
.band-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(2rem,5vw,5rem)}
.territory-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0;border-top:1px solid var(--line)}
.territory-row a{display:block;padding:1.1rem 1rem 1.2rem 0;border-bottom:1px solid var(--line);text-decoration:none}
.territory-row a:hover .t-name{color:var(--cyan)}
.t-name{font-family:var(--font-display);font-size:1.35rem;font-weight:500;transition:color .25s;display:block}
.stages{list-style:none;margin:0;padding:0;counter-reset:st}
.stages li{counter-increment:st;display:grid;grid-template-columns:2.6rem 1fr;gap:.2rem 1rem;padding:.85rem 0;border-bottom:1px solid var(--line)}
.stages li::before{content:counter(st);font-family:var(--font-display);font-size:1.3rem;color:var(--gold);line-height:1.2}
.stages b{font-weight:600}
.notice{display:flex;gap:1rem;align-items:flex-start;padding:1.2rem 1.4rem;border-left:2px solid var(--gold);background:var(--gold-soft);border-radius:0 10px 10px 0;max-width:70ch}

/* World */
.world{position:relative;height:calc(100svh - var(--top) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 45% 45%,color-mix(in srgb,var(--sea) 70%,var(--bg-2)) 0%,var(--sea) 60%,var(--bg) 100%)}
.world::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--graticule) 1px,transparent 1px),linear-gradient(90deg,var(--graticule) 1px,transparent 1px);background-size:72px 72px;pointer-events:none}
.map-stage{position:absolute;inset:0}
.map-stage.flat{right:420px;padding:1.2rem 1.5rem 4.5rem}
.map-stage.flat > svg{position:static}
.map-tools{position:absolute;left:1.5rem;bottom:2.4rem;display:flex;align-items:center;gap:1.3rem;z-index:3;padding:.55rem .9rem;border-radius:10px;font-size:.85rem}
.toggle{display:inline-flex;align-items:center;gap:.55rem;cursor:pointer;color:var(--muted);background:none;border:0;padding:.2rem 0}
.toggle .track{width:30px;height:16px;border:1px solid var(--line-strong);position:relative;transition:background .25s}
.toggle .track::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--faint);transition:transform .3s var(--ease),background .25s}
.toggle[aria-pressed="true"]{color:var(--text)}
.toggle[aria-pressed="true"] .track{background:color-mix(in srgb,var(--cyan) 18%,transparent)}
.toggle[aria-pressed="true"] .track::after{transform:translateX(14px);background:var(--cyan)}
.map-note{position:absolute;left:1.6rem;bottom:.8rem;z-index:3;font-size:.76rem;color:var(--faint)}
.world-panel{position:absolute;top:1rem;right:1rem;bottom:1rem;z-index:3;width:396px;overflow:auto;padding:1.6rem 1.5rem;animation:panelIn .5s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateX(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.4rem}
.rlist{list-style:none;margin:1rem 0 0;padding:0}
.rlist button{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.2rem 1rem;padding:.8rem .2rem;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.rlist button:hover .rl-name{color:var(--cyan)}
.rl-name{font-family:var(--font-display);font-size:1.18rem;font-weight:500;transition:color .2s}
.rl-sub{grid-column:1;font-size:.8rem;color:var(--muted)}
.rlist .chip{grid-row:1 / span 2;grid-column:2}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin:1.3rem 0}
.ledger h3{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:.5rem}
.ledger ul{list-style:none;padding:0;margin:0;display:grid;gap:.45rem;font-size:.9rem;line-height:1.4}
.ledger li{padding-left:1rem;position:relative}
.ledger .pos li::before,.ledger .neg li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;transform:rotate(45deg)}
.ledger .pos li::before{background:var(--cyan)}
.ledger .neg li::before{border:1px solid var(--warn)}
.panel-section{padding-top:1rem;margin-top:1rem;border-top:1px solid var(--line)}
.dep-list{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.55rem;font-size:.9rem}
.dep-list li{display:grid;grid-template-columns:18px 1fr;gap:.5rem;line-height:1.4}
.dep-list svg{width:14px;height:14px;margin-top:.2rem;color:var(--cyan)}
.lock-note{display:flex;gap:.7rem;padding:.9rem 1rem;border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);border-radius:8px;font-size:.9rem;line-height:1.45;margin-top:1rem}
.lock-note.mythic{border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.lock-note svg{width:16px;height:16px;flex:none;margin-top:.15rem}

/* Region page */
.region-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,4rem);align-items:center;margin-bottom:3rem}
.region-hero h1{margin:.6rem 0 1rem}
.people{font-family:var(--font-display);font-style:italic;font-size:1.3rem;color:var(--muted);margin-bottom:1.2rem}
.mini{aspect-ratio:4/3;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 40px 80px -40px var(--shadow),inset 0 0 0 1px var(--line)}
.landscape{font-family:var(--font-display);font-style:italic;font-size:1.08rem;line-height:1.5;color:var(--muted);margin-top:1.1rem;max-width:52ch}
.balance{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);margin-bottom:3rem}
.balance > div{padding:1.6rem 1.8rem 1.8rem 0}
.balance > div + div{padding-left:1.8rem;border-left:1px solid var(--line-strong)}
.balance h2{font-family:var(--font-display);font-size:1.5rem;margin-bottom:1rem}
.balance ul{list-style:none;padding:0;margin:0;display:grid;gap:.7rem}
.balance li{position:relative;padding-left:1.2rem;line-height:1.45}
.balance .pos li::before,.balance .neg li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;transform:rotate(45deg)}
.balance .pos li::before{background:var(--cyan)}
.balance .neg li::before{border:1px solid var(--warn)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.5rem;margin-bottom:3rem}
.col h2{font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:.9rem}
.plain{list-style:none;padding:0;margin:0;display:grid;gap:.75rem;line-height:1.45}
.plain li{padding-bottom:.75rem;border-bottom:1px solid var(--line)}
.plain li:last-child{border-bottom:0}
.action-bar{position:sticky;bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;margin-top:2rem;z-index:5}
.back{display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--muted);text-decoration:none;margin-bottom:1.5rem}
.back:hover{color:var(--text)}
.back svg{width:14px;height:14px}

/* Hotex */
.hotex{min-height:calc(100svh - var(--top));display:grid;place-items:center;padding:2rem clamp(1rem,4vw,2rem) 4rem;background:radial-gradient(ellipse 60% 50% at 50% 20%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%)}
.hotex-card{width:min(640px,100%);padding:clamp(1.6rem,4vw,2.8rem)}
.steps{display:flex;align-items:center;gap:.4rem;margin-bottom:2.2rem}
.steps i{flex:1;height:1px;background:var(--line-strong);position:relative}
.steps i.done{background:var(--gold)}
.steps b{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--line-strong);flex:none}
.steps b.done{background:var(--gold);border-color:var(--gold)}
.steps b.now{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.step-label{font-size:.82rem;color:var(--muted);margin-bottom:.7rem}
.hotex h1{font-size:clamp(2.1rem,5vw,3.2rem);margin-bottom:1rem}
.facts{display:grid;gap:1.2rem;margin:1.8rem 0 2.2rem}
.facts div{display:grid;grid-template-columns:34px 1fr;gap:.9rem;align-items:start}
.facts svg{width:26px;height:26px;color:var(--gold)}
.field{display:grid;gap:.5rem;margin:1.8rem 0 .6rem}
.field label{font-size:.88rem;font-weight:600}
.input{width:100%;padding:.9rem 1rem;font:500 1.15rem var(--font-ui);color:var(--text);background:var(--surface-strong);border:1px solid var(--line-strong);border-radius:6px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 16%,transparent)}
.hint{font-size:.82rem;color:var(--muted);min-height:1.3em}
.hint.err{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:.6rem 0 1.6rem}
.tile{padding:.85rem .8rem;text-align:left;background:var(--surface-strong);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s}
.tile b{display:block;font-weight:600;font-size:.95rem}
.tile span{font-size:.78rem;color:var(--muted);line-height:1.35;display:block;margin-top:.15rem}
.tile[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 9%,var(--surface-strong))}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;font-size:1rem}
.passport{position:relative;padding:1.6rem 1.6rem 1.4rem;margin:1.6rem 0 2rem;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:10px;background:linear-gradient(160deg,var(--gold-soft),transparent 60%);overflow:hidden}
.passport::before{content:"X";position:absolute;right:-.6rem;bottom:-3.2rem;font-family:var(--font-display);font-size:11rem;line-height:1;color:var(--gold);opacity:.08}
.passport dl{display:grid;grid-template-columns:auto 1fr;gap:.55rem 1.4rem;margin:1.1rem 0 0;font-size:.92rem}
.passport dt{color:var(--muted)}
.passport dd{margin:0;font-weight:600}
.passport .pp-name{font-family:var(--font-display);font-size:2rem;line-height:1.1}

/* Quests / Chronicle / Profile */
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1.5rem;margin-bottom:2.5rem}
.page-head .lede{margin-top:.8rem}
.quests{display:grid;gap:1rem}
.quest{display:grid;grid-template-columns:1fr auto;gap:1rem 2rem;align-items:center;padding:1.4rem 1.5rem}
.quest h3{font-size:1.12rem;margin-bottom:.3rem}
.qbar{height:3px;background:var(--line);margin-top:1rem;position:relative;max-width:360px}
.qbar span{position:absolute;inset:0 auto 0 0;background:var(--cyan);transition:width .6s var(--ease)}
.reward{font-size:.84rem;color:var(--muted);margin-top:.55rem}
.quest.claimed{opacity:.72}
.quest .state{font-size:.86rem;color:var(--cyan);display:inline-flex;gap:.4rem;align-items:center}
.quest .state svg{width:14px;height:14px;flex:none}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:7px;top:.6rem;bottom:.6rem;width:1px;background:var(--line-strong)}
.timeline li{position:relative;display:grid;grid-template-columns:150px 1fr;gap:.3rem 2rem;padding:0 0 2rem 2.4rem}
.timeline li::before{content:"";position:absolute;left:3px;top:.45rem;width:9px;height:9px;transform:rotate(45deg);background:var(--bg);border:1px solid var(--cyan)}
.timeline li.notable::before{background:var(--cyan)}
.timeline li.legacy::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.timeline time{font-size:.84rem;color:var(--muted);padding-top:.1rem}
.timeline h3{font-family:var(--font-display);font-size:1.35rem;font-weight:500;margin-bottom:.25rem}
.timeline li.legacy h3{color:var(--gold)}
.empty{padding:2.4rem;text-align:left;display:grid;gap:1.1rem;justify-items:start}
.profile-hero{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center;margin-bottom:2.8rem}
.level-ring{position:relative;width:132px;height:132px}
.level-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.level-ring .lv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.level-ring .lv b{font-family:var(--font-display);font-size:2.4rem;font-weight:500;display:block}
.level-ring .lv span{font-size:.76rem;color:var(--muted);display:block;margin-top:.3rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.card{padding:1.5rem 1.6rem}
.card h2{font-size:.92rem;font-weight:600;color:var(--muted);margin-bottom:1rem}
.rep{display:grid;gap:.85rem}
.rep div{display:grid;grid-template-columns:96px 1fr 34px;gap:.8rem;align-items:center;font-size:.9rem}
.rep i{height:4px;background:var(--line);position:relative}
.rep i span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.rep em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.6rem 1.4rem;margin:0;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.roadmap{list-style:none;margin:0;padding:0;counter-reset:ph}
.roadmap li{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.8rem;padding:.75rem 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:.93rem}
.roadmap li:last-child{border-bottom:0}
.roadmap .ph{font-family:var(--font-display);color:var(--faint);font-size:1.1rem}
.roadmap li.now .ph{color:var(--cyan)}
.roadmap li.now{font-weight:600}

/* Wallet + identity */
.sim-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .75rem;font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:var(--gold-soft)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.asset{padding:1.3rem 1.3rem 1.2rem;display:grid;gap:.45rem;align-content:start}
.asset-head{display:grid;gap:.15rem}
.asset-head b{font-family:var(--font-display);font-size:1.45rem;font-weight:500}
.asset-amt{font-family:var(--font-display);font-size:2.1rem;line-height:1.1;font-variant-numeric:tabular-nums}
.asset-how{font-size:.8rem;color:var(--cyan);line-height:1.4}
.ledger-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ledger-list li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.ledger-list li > div{display:grid;gap:.2rem}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--cyan)}.amt.neg{color:var(--warn)}
.profile-id{margin-bottom:2.6rem}
.profile-id h1{margin:.3rem 0 1.6rem}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line-strong)}
.ladder li{position:relative;padding:1.1rem 1rem 0 0;display:grid;gap:.3rem;align-content:start}
.ladder li::before{content:"";position:absolute;top:-6px;left:0;width:11px;height:11px;transform:rotate(45deg);background:var(--bg);border:1px solid var(--line-strong)}
.ladder li.done::before{background:var(--cyan);border-color:var(--cyan)}
.ladder li.now::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.ladder b{font-family:var(--font-display);font-size:1.25rem;font-weight:500}
.ladder li:not(.done):not(.now) b{color:var(--faint)}
.ladder span{font-size:.82rem;color:var(--muted);line-height:1.45}
@media (max-width:820px){ .ladder{grid-template-columns:1fr 1fr;row-gap:1.4rem} .dock a{font-size:.64rem} }

/* Activities */
.activity{padding:clamp(1.3rem,3vw,2rem);margin-top:-1rem}
.act-h{font-family:var(--font-display);font-size:1.6rem;font-weight:500;margin-bottom:.6rem}
.gate{display:grid;gap:1rem;justify-items:start}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-top:1.2rem}
.choice{padding:1.2rem;display:grid;gap:.7rem;justify-items:start}
.choice b{font-size:1.05rem}
.timer{margin-top:1rem;display:grid;gap:.6rem;max-width:520px}
.tbar{height:6px;background:var(--line);position:relative;overflow:hidden}
.tbar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .9s linear}
.seg{display:inline-flex;border:1px solid var(--line-strong);margin:.4rem 0 1rem}
.seg button{background:none;border:0;padding:.55rem 1rem;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--text)}
.swap-row{display:grid;gap:.4rem;margin-bottom:.9rem;max-width:420px}
.quote{margin-top:1rem;padding:1rem 1.1rem;border:1px solid var(--line);border-radius:8px;max-width:520px;display:grid;gap:1rem;justify-items:start}
.checks{list-style:none;margin:1rem 0 1.2rem;padding:0;display:grid;gap:.6rem}
.checks li{position:relative;padding-left:1.6rem;line-height:1.45}
.checks li::before{position:absolute;left:0;top:0;font-weight:700}
.checks li.ok::before{content:"✓";color:var(--cyan)}
.checks li.no::before{content:"✕";color:var(--warn)}
.checks li.pending::before{content:"…";color:var(--gold)}
.lawcard{margin-top:1rem;padding:1rem 1.1rem;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:0 8px 8px 0;display:grid;gap:.35rem;max-width:620px;animation:fadeIn .4s}
.lawcard p{color:var(--muted);font-size:.92rem;line-height:1.5}
.law-try{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem 1.4rem;margin-bottom:1.5rem}

.motions{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;gap:1rem}
.motion{padding:1.2rem 1.3rem;display:grid;gap:.6rem;justify-items:start}
.motion h3{font-family:var(--font-display);font-size:1.3rem;font-weight:500}
.mstate{font-size:.75rem;font-weight:700;padding:.15rem .5rem;border:1px solid var(--line-strong);color:var(--muted)}
.mstate.voting{color:var(--cyan);border-color:var(--cyan)}.mstate.executed{color:var(--gold);border-color:var(--gold)}.mstate.rejected{color:var(--warn);border-color:var(--warn)}

.eh{font-size:1.6rem;margin:2.6rem 0 .9rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl table.wide{min-width:560px}
.tbl th,.tbl td{text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--surface)}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
.tbl code{font-size:.8rem}
.cs{font-size:.7rem;font-weight:700;padding:.1rem .4rem;border-radius:2px}
.cs-canon{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}.cs-simulation{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}.cs-founder{color:var(--gold);background:var(--gold-soft)}.cs-tbd{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}

.span2{grid-column:1/-1}
.axes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem 1.6rem}
.axis b{font-family:var(--font-display);font-size:1.2rem;font-weight:500}
.axis ul{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.3rem;font-size:.88rem}
.axis li{padding-left:.9rem;position:relative}.axis li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;background:var(--cyan);transform:rotate(45deg)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.ach{padding:.9rem 1rem;border:1px dashed var(--line-strong);border-radius:8px;display:grid;gap:.3rem;opacity:.6}
.ach.got{opacity:1;border-style:solid;border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:var(--gold-soft)}
.ach b{font-weight:600}.ach span{font-size:.8rem;color:var(--muted)}
.evlist{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.evlist li{display:flex;justify-content:space-between;gap:1rem;font-size:.84rem;border-bottom:1px solid var(--line);padding-bottom:.4rem}
.evlist code{font-size:.76rem;color:var(--cyan)}
.next-obj{padding:1.4rem 1.5rem;margin-bottom:1rem;border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.disc{font-size:.72rem;font-weight:600;padding:.1rem .45rem;border:1px solid var(--line-strong);border-radius:2px;color:var(--muted);white-space:nowrap}
.disc-2{color:var(--blue);border-color:var(--blue)}.disc-3{color:var(--cyan);border-color:var(--cyan)}.disc-4{color:var(--gold);border-color:var(--gold)}

.calc{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem;max-width:460px}

.ev-banner{display:grid;gap:.5rem;margin:0 0 1.2rem}
.ev-banner > div{display:grid;gap:.2rem;padding:.75rem 1rem;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0}
.ev-banner span{font-size:.86rem;color:var(--muted)}
.world-events{position:absolute;left:1.5rem;top:1rem;z-index:3;max-width:min(460px,calc(100% - 460px))}
.world-events .ev-banner > div{background:rgba(28,20,8,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#F3E6C8}
.world-events .ev-banner span{color:#D9CCB0}
.scene-arcs .arc.disrupted{stroke:#E39377;stroke-dasharray:2 6;filter:none}
@media (max-width:820px){ .world-events{position:static;max-width:none;margin:.8rem 1rem 0} }

.mission{padding:1.3rem 1.4rem;display:grid;gap:.6rem}
.mission h3{font-family:var(--font-display);font-size:1.35rem;font-weight:500}
.mission.locked{opacity:.6}.mission.archived{opacity:.75}
.mhead{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.stages-list{margin:.2rem 0;padding-left:1.2rem;display:grid;gap:.3rem;font-size:.9rem}
.stages-list li.ok{color:var(--cyan)}.stages-list li.now{font-weight:600}
.archive summary{cursor:pointer;list-style:none}
.pp-artifact{padding:clamp(1.4rem,3vw,2.2rem);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:linear-gradient(160deg,var(--gold-soft),var(--surface) 55%)}
.pp-top{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.pp-top .sim-badge{margin-left:auto}
.pp-emblem svg{width:34px;height:34px;color:var(--gold)}
.pp-artifact h1{margin:.2rem 0 1.4rem}
.grid2 > .card{min-width:0}
.pubcard{margin-top:1rem;padding:1rem 1.2rem;border:1px solid var(--line-strong);border-radius:10px;display:grid;gap:.25rem;max-width:380px}
.pubcard b{font-family:var(--font-display);font-size:1.4rem;font-weight:500}

.rights{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
.rights h3{font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
@media (max-width:820px){ .rights{grid-template-columns:1fr} }

.gov-box{margin-top:1rem;padding:1rem 1.1rem;border:1px solid var(--line);border-radius:10px}
.gov-box summary{cursor:pointer}

.arrival{margin:0 0 1.2rem;padding:.2rem 0 .2rem 1rem;border-left:2px solid var(--gold);font-family:var(--font-display);font-style:italic;font-size:1.05rem;line-height:1.5;color:var(--muted);max-width:52ch}
.arrival cite{display:block;font-family:var(--font-ui);font-style:normal;font-size:.75rem;color:var(--faint);margin-top:.4rem}
.stages.lore li::before{font-size:1.1rem}

.ppx{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.ppx li{padding:.8rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ppx li.mine{border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.ppx-h{display:flex;flex-wrap:wrap;gap:.6rem;align-items:baseline}
.ppx p{margin:.35rem 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ppx-a{display:flex;gap:1rem;align-items:center}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.ccard{padding:.8rem .9rem;border:1px solid var(--line);border-radius:10px;display:grid;gap:.2rem}

#guide{position:fixed;left:1rem;bottom:1rem;z-index:45;max-width:min(420px,calc(100vw - 2rem))}
.guide{padding:1rem 1.1rem;display:grid;gap:.6rem;border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.guide-top{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.guide-steps{display:flex;gap:.35rem}
.guide-steps i{flex:1;height:3px;background:var(--line-strong)}
.guide-steps i.done{background:var(--cyan)}.guide-steps i.now{background:var(--gold)}
.guide p{line-height:1.45}
.guide-pill{border:1px solid color-mix(in srgb,var(--cyan) 50%,transparent);background:var(--surface-strong);color:var(--text);padding:.5rem .9rem;border-radius:999px;font-weight:600;font-size:.82rem;cursor:pointer;box-shadow:0 10px 30px -12px var(--shadow)}
#intro{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(ellipse at 50% 55%,rgba(8,14,30,.9),rgba(4,7,15,.98) 75%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#E7ECF5}
#intro[hidden]{display:none}
.intro-in{max-width:640px;text-align:center;display:grid;gap:1.6rem}
.intro-card{animation:fadeIn 1.2s var(--ease)}
.intro-card h2{font-size:clamp(2rem,6vw,3.4rem);margin:.4rem 0 1rem;color:#F3E6C8}
.intro-card .lede{color:#C9D3E6;margin:0 auto;font-family:var(--font-display);font-style:italic;font-size:clamp(1.1rem,2.6vw,1.4rem);line-height:1.6}
.intro-dots{display:flex;gap:.5rem;justify-content:center}
.intro-dots i{width:8px;height:8px;transform:rotate(45deg);border:1px solid rgba(232,201,138,.6)}
.intro-dots i.on{background:#E8C98A}
#intro .link{color:#C9D3E6}
@media (max-width:820px){ #guide{left:.6rem;right:.6rem;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:none} .toast{bottom:auto;top:calc(var(--top) + env(safe-area-inset-top,0px) + .5rem);transform:translate(-50%,-14px)} .toast.show{transform:translate(-50%,0)} }

.fb-btn{margin-left:auto;background:none;border:1px solid var(--line-strong);color:var(--muted);font-weight:600;font-size:.78rem;padding:.35rem .7rem;border-radius:999px;cursor:pointer}
.fb-btn + .nav{margin-left:1rem}
@media (max-width:820px){ .fb-btn{margin-left:auto;margin-right:.6rem} }
#fb{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:1rem;background:rgba(4,7,15,.6)}
#fb[hidden]{display:none}
.fb-card{width:min(460px,100%);padding:1.4rem 1.4rem 1.2rem}
.fb-stars{display:flex;gap:.4rem;margin:1rem 0}
.fb-stars button{background:none;border:1px solid var(--line-strong);color:var(--faint);width:38px;height:38px;border-radius:6px;cursor:pointer;font-size:1rem}
.fb-stars button.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.funnel{display:grid;gap:.5rem}
.fn-row{display:grid;grid-template-columns:170px 1fr 70px;gap:.8rem;align-items:center;font-size:.88rem}
.fn-row i{height:10px;background:var(--line);position:relative;border-radius:2px}
.fn-row b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:2px}
.fn-row em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;padding:.85rem 1.2rem;width:max-content;max-width:min(92vw,460px);font-size:.92rem;transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none;display:flex;gap:.7rem;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast::before{content:"";width:8px;height:8px;flex:none;transform:rotate(45deg);background:var(--gold)}
footer.foot{padding:2rem clamp(1.1rem,4vw,2.5rem) 6rem;max-width:1180px;margin:0 auto;font-size:.8rem;color:var(--faint)}

.fade-in{animation:fadeIn .55s var(--ease)}
@keyframes fadeIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}

/* Responsive */
@media (max-width:980px){
  .region-hero{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr 1fr}
  .band-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  :root{--top:58px}
  .nav,.who .who-text{display:none}
  .who{margin-left:auto}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0px));background:var(--surface-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .dock a{flex:1;display:grid;justify-items:center;gap:.2rem;padding:.4rem 0;font-size:.7rem;font-weight:500;text-decoration:none;color:var(--faint)}
  .dock svg{width:21px;height:21px}
  .dock a[aria-current="page"]{color:var(--cyan)}
  main{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .world{height:auto;min-height:0;overflow:visible;background:none}
  .world::before{display:none}
  .map-stage{position:relative;inset:auto;height:56svh;min-height:340px}
  .map-stage.flat{right:auto;height:auto;aspect-ratio:1000/720;padding:.4rem;background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--sea) 70%,var(--bg-2)),var(--sea))}
  .tl b{font-size:.95rem}
  .tl span{display:none}
  .map-stage .tl{min-height:30px;padding:.3rem .5rem}
  .map-stage .tl::after{display:none}
  .map-tools{position:static;margin:.8rem 1rem 0;justify-content:space-between}
  .map-note{position:static;display:block;margin:.6rem 1rem 0}
  .world-panel{position:relative;inset:auto;width:auto;margin:1rem;overflow:visible;animation:none}
  .balance{grid-template-columns:1fr}
  .balance > div + div{padding-left:0;border-left:0;border-top:1px solid var(--line-strong)}
  .cols{grid-template-columns:1fr;gap:2rem}
  .tiles{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .timeline li{grid-template-columns:1fr}
  .quest{grid-template-columns:1fr}
  .profile-hero{grid-template-columns:1fr;gap:1.4rem}
  .hero-copy h1{max-width:14ch}
  .hero-veil{background:linear-gradient(0deg,var(--bg) 25%,color-mix(in srgb,var(--bg) 55%,transparent) 65%,transparent)}
  .hero{align-items:end}
  .hero-map{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);opacity:1;bottom:28%}
  .action-bar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ledger{grid-template-columns:1fr}
}

/* Engraved titles */
h1.display{background:linear-gradient(180deg,var(--ivory-hi) 38%,var(--ivory-lo) 118%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:.06em}
.display{font-variation-settings:"opsz" 96}

/* Blade-cut glass with a gilded leading edge */
.glass{border-radius:var(--blade);background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 8%,transparent),transparent 34%),var(--surface);border-color:var(--line);border-top-color:color-mix(in srgb,var(--gold) 30%,var(--line));border-left-color:color-mix(in srgb,var(--gold) 18%,var(--line))}
.toast.glass,.guide.glass{border-radius:var(--blade-s)}
.chip,.tag,.pl{border-radius:1px 6px 1px 6px}

/* Buttons: primary is a lit glacier crystal; gold is reserved for moments that commit */
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 34%,transparent),color-mix(in srgb,var(--cyan) 13%,transparent));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -14px 24px -16px color-mix(in srgb,var(--cyan) 80%,transparent);text-shadow:0 0 14px color-mix(in srgb,var(--cyan) 55%,transparent)}
.btn-primary::after{background:linear-gradient(105deg,transparent 30%,color-mix(in srgb,var(--cyan) 45%,transparent) 48%,transparent 66%)}
.btn-gold{background:linear-gradient(180deg,#F7E6BC,#C9A15A 92%);color:#1A1205;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(90,60,10,.35),inset 0 0 0 1px rgba(120,84,26,.35)}
.btn-quiet{background:color-mix(in srgb,var(--surface-strong) 70%,transparent);box-shadow:inset 0 0 0 1px var(--line-strong),inset 0 1px 0 var(--edge)}

/* Top bar */
.topbar-inner{background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 92%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 72%,transparent 100%)}
.fb-btn{margin-left:0;order:3;border-radius:1px 8px 1px 8px;border-color:color-mix(in srgb,var(--gold) 35%,var(--line-strong));color:var(--gold)}
.fb-btn + .nav{margin-left:auto}
.topbar-inner > .nav{order:2}.topbar-inner > .who{order:4}
.nav a[aria-current="page"]::after{width:5px;height:5px;bottom:0;background:var(--gold);box-shadow:0 0 12px var(--gold)}

/* Hero: the world, full bleed, and one orchestrated line */
.hero{grid-template-rows:1fr auto;align-items:center;min-height:100svh}
.hero-map{-webkit-mask-image:none;mask-image:none}
.hero-veil{background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 94%,transparent) 0%,color-mix(in srgb,var(--bg) 58%,transparent) 36%,transparent 64%),linear-gradient(0deg,var(--bg) 0%,transparent 30%),linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,transparent) 0%,transparent 18%)}
.hero-copy{grid-row:1;align-self:center}
.hero-title{font-size:clamp(3rem,7.4vw,6.9rem) !important;line-height:.95 !important;max-width:none !important;margin-bottom:2rem !important;letter-spacing:-.018em}
.hero-title span{display:block;background:inherit;-webkit-background-clip:text;background-clip:text;animation:engrave 1.7s var(--ease) both}
.hero-title span + span{animation-delay:.6s}
@keyframes engrave{from{opacity:0;letter-spacing:.08em;filter:blur(12px)}to{opacity:1;letter-spacing:-.018em;filter:none}}
.hero-lede{max-width:46ch;animation:fadeIn 1.1s 1.2s var(--ease) both}
.hero-cta{animation:fadeIn 1.1s 1.45s var(--ease) both}
.atlas{grid-row:2;position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem .2rem;padding:1rem clamp(1rem,3vw,2.2rem) 1.6rem;border-top:1px solid color-mix(in srgb,var(--gold) 22%,var(--line))}
.atlas a{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;font-size:.85rem;font-weight:500;color:var(--muted);text-decoration:none;transition:color .2s}
.atlas a:hover,.atlas a:focus-visible{color:var(--text)}
.atlas i,.rl-dot{flex:none;width:7px;height:7px;transform:rotate(45deg);background:hsl(var(--h) 62% 64%);box-shadow:0 0 10px hsl(var(--h) 75% 60% / .55)}
.territory-row .t-name{display:flex;align-items:center;gap:.55rem}

/* Territory list carries each land's own colour */
.rl-name{display:flex;align-items:center;gap:.6rem}
.rlist button{border-bottom-color:color-mix(in srgb,var(--line) 80%,transparent)}
.rlist button:hover{background:linear-gradient(90deg,hsl(var(--h) 60% 50% / .08),transparent 70%)}

/* Tabs and section rules pick up the gilded edge */
.tabs button[aria-selected="true"]::after{background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 20%,transparent))}
.band{border-top-color:color-mix(in srgb,var(--gold) 16%,var(--line))}
.stages li::before{font-style:italic}

@media (max-width:820px){
  .dock{background:color-mix(in srgb,var(--surface-strong) 88%,transparent);border-top:1px solid color-mix(in srgb,var(--gold) 26%,var(--line));border-radius:16px 16px 0 0}
  .dock a[aria-current="page"]{color:var(--text)}
  .dock a[aria-current="page"] svg{color:var(--cyan);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--cyan) 70%,transparent))}
  .fb-btn{margin-left:auto;order:3}.topbar-inner > .who{margin-left:.6rem}
  .hero{min-height:calc(100svh - 68px);align-items:end}
  .hero-map{bottom:30%}
  .hero-veil{background:linear-gradient(0deg,var(--bg) 30%,color-mix(in srgb,var(--bg) 55%,transparent) 62%,transparent 82%)}
  .hero-copy{align-self:end;padding-bottom:1rem}
  .hero-title{font-size:clamp(2.6rem,12vw,3.6rem) !important}
  .atlas{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:.6rem 1rem 1rem;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .atlas::-webkit-scrollbar{display:none}
  .atlas a{white-space:nowrap;padding:.4rem .7rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
/* ===== r40 Atlas UI: the cartographer's war table =====
   Design from the Lovable pass (founder-approved), applied to the prototype.
   Emblems and ornaments come from the sprite (#xe-*, #xs-*, #xo-*, #xi-*). */
:root{
  --font-display:"Marcellus",Georgia,"Times New Roman",serif;
  --brass-hi:#FBE7B0; --brass-lo:#D2A55A; --brass-edge:#947039; --brass-ink:#1A1205;
  --brass-hairline:color-mix(in srgb,var(--gold) 38%,transparent);
  --panel-solid:#FBFCFE; --wash:.14; --small:15px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--panel-solid:#0E162C;--wash:.2} }
:root[data-theme="dark"]{--panel-solid:#0E162C;--wash:.2}

html{font-size:17px}
body{line-height:1.6;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Type: Marcellus is a single-weight inscriptional face; never fake-bold it */
.display,h1.display,h2.display,.t-name,.rl-name,.sc-name,.act-h,.balance h2,.timeline h3,.motion h3,.mission h3,.ladder b,.asset-head b,.axis b,.pubcard b,.wordmark,.pp-name,.tl b,.intro-card h2,.pgroup h3,.people,.arrival,.landscape,.sc-role{font-weight:400}
.display{letter-spacing:0;line-height:1.08}
h1.display{background:none;color:var(--ivory-hi);-webkit-text-fill-color:currentColor}
.hero-title{text-shadow:0 2px 22px color-mix(in srgb,var(--bg) 85%,transparent);font-size:clamp(2.6rem,5vw,4.5rem) !important;line-height:1.06 !important;letter-spacing:0}
.hero-title span{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ivory-hi);-webkit-text-fill-color:currentColor}
@keyframes engrave{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.people,.arrival,.landscape,.sc-role,.intro-card .lede{font-style:normal}
.lede{color:var(--text);opacity:.9}

/* Readable small text: nothing below 15px */
.meta,.hint,.step-label,.rl-sub,.tile span,.timeline time,.reward,.asset-how,.ladder span,.ach span,.evlist li,.tbl table,.tbl th,.fn-row,.map-note,.sc-head span,.dist-tag,.disc,.mstate,.cs,.tag,.chip,.toggle,.map-tools,.fb-btn,.sim-badge,.back,.plist span,.atlas a,.arrival cite,.quest .state,.seg button,.guide-pill,.dock a,.ev-banner span,.kv,.rep div{font-size:var(--small)}
.tl span{font-size:13.5px}
.pl{font-size:14px}
.pl.founder{font-size:12.5px}
.tag{padding:.08rem .45rem;border-radius:3px}
.tag-prov,.tag-tbd{color:var(--gold);background:none;border:1px solid var(--brass-hairline)}

/* Panels: chamfered brass instruments with an inner hairline */
.glass{border-radius:0;border:1px solid var(--line-strong);background:var(--surface-strong);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
  box-shadow:inset 0 0 0 3px var(--panel-solid),inset 0 0 0 4px var(--brass-hairline)}
.toast.glass,.guide.glass{border-radius:0}
.chip,.pl,.tile,.input,.quote,.ppx li,.ccard,.pubcard,.gov-box,.ach,.tbl,.lock-note,.mini,.fb-stars button{border-radius:4px}
.mini{border-radius:0}

/* Buttons: brass for commitment, outline for the rest */
.btn{border-radius:0;font-weight:600;letter-spacing:0;font-size:1rem}
.btn-primary,.btn-gold{background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));color:var(--brass-ink);box-shadow:inset 0 0 0 1px var(--brass-edge),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-primary::after,.btn-gold::after{background:linear-gradient(105deg,transparent 30%,rgba(255,250,230,.55) 48%,transparent 66%)}
.btn-primary:active,.btn-gold:active{box-shadow:inset 0 0 0 1px var(--brass-edge),inset 0 2px 5px rgba(65,43,12,.35)}
.btn-quiet{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn-quiet:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.link{background-image:linear-gradient(var(--gold),var(--gold))}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.tile[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--text)}
.toggle[aria-pressed="true"] .track{background:var(--gold-soft)}
.toggle[aria-pressed="true"] .track::after{background:var(--gold)}
.tabs button[aria-selected="true"]{color:var(--gold)}
.tabs button[aria-selected="true"]::after{background:var(--gold)}
.qbar span,.tbar span{background:linear-gradient(90deg,var(--brass-lo),var(--gold))}

/* Top bar: a thin brass HUD strip */
.topbar-inner{background:var(--surface-strong);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--brass-hairline)}
.wordmark{font-size:1.7rem;color:var(--ivory-hi)}
.wordmark svg{color:var(--gold)}
.nav a{display:flex;align-items:center;gap:.45rem;font-size:1rem}
.nav a svg{width:19px;height:19px;flex:none}
.nav a[aria-current="page"]{color:var(--gold)}
.nav a[aria-current="page"]::after{left:.95rem;right:.95rem;width:auto;height:2px;bottom:-.2rem;transform:none;background:var(--gold);box-shadow:none}
.fb-btn{border-radius:4px}
.theme-btn{order:3;display:grid;place-items:center;width:38px;height:38px;margin-left:.2rem;background:none;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted);cursor:pointer}
.theme-btn:hover{color:var(--gold);border-color:var(--gold)}
.theme-btn svg{width:18px;height:18px}
.who .sigil{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}

/* Status: wax seals */
.seal{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;font-variant:small-caps;font-weight:600;font-size:16px;letter-spacing:.03em;color:var(--text);vertical-align:middle}
.seal svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.seal.st-mythic svg{filter:drop-shadow(0 0 4px rgba(169,139,255,.55)) drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.seal.bare span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seal.bare svg{width:22px;height:22px}

/* Emblems */
.xl-emblem{display:inline-block;flex:none;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  a:hover .xl-emblem,button:hover .xl-emblem,a:focus-visible .xl-emblem,button:focus-visible .xl-emblem{transform:translateY(-2px);filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--gold) 40%,transparent)) drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:transform .2s var(--ease),filter .2s}
}

/* Territory rows: emblem, name and people line, seal; tinted with the land's own colour */
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:80px;text-align:left;text-decoration:none;color:var(--text);background:linear-gradient(90deg,hsl(var(--h) 45% 40% / var(--wash)),transparent 65%);border:0;border-left:3px solid hsl(var(--h) 50% 50%);border-bottom:1px solid var(--line);cursor:pointer;font:inherit}
.trow-copy{flex:1;min-width:0;display:block;line-height:1.35}
.trow-copy b{display:block;font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--ivory-hi)}
.trow-copy span{display:block;font-size:16px;color:var(--muted);margin-top:2px}
.trow.locked .trow-copy b{color:var(--muted)}
.trow > .seal{margin-left:auto}
.trow:hover .trow-copy b{color:var(--gold)}
.territory-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;border-top:0}
.territory-row a.trow{display:flex;padding:12px 14px;border-bottom:1px solid var(--line)}
.territory-row a.trow .t-name{display:block}
.rlist{margin-top:.9rem}
.rlist li + li{margin-top:0}
.rlist button.trow{display:flex;grid-template-columns:none}

/* Hero territory strip */
.atlas a{gap:.45rem}
.atlas a .xl-emblem{width:22px;height:26px}

/* Codex header (world panel) */
.panel-head.tinted{align-items:center;justify-content:flex-start;gap:14px;margin:0 -10px .6rem;padding:10px;background:linear-gradient(90deg,hsl(var(--h) 45% 40% / var(--wash)),transparent 70%);border-left:3px solid hsl(var(--h) 50% 50%)}
.panel-head.tinted > div{flex:1;min-width:0}
.panel-head.tinted h2{margin-bottom:.35rem}
.ledger .pos h3{color:var(--cyan)}.ledger .neg h3{color:var(--warn)}
.ledger h3{font-size:16px}
.world-panel{width:412px;padding:1.6rem 1.5rem}

/* Map instruments */
.world-compass{position:absolute;right:calc(412px + 2.4rem);bottom:2.2rem;z-index:3;pointer-events:none;width:84px;height:84px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.xl-corners{position:absolute;inset:10px;pointer-events:none;z-index:2}
.xl-corners > span{position:absolute;line-height:0;color:var(--gold)}
.xl-corners svg{width:34px;height:34px}
.xl-corners .c-tl{left:0;top:0}
.xl-corners .c-tr{right:0;top:0;transform:scaleX(-1)}
.xl-corners .c-bl{left:0;bottom:0;transform:scaleY(-1)}
.xl-corners .c-br{right:0;bottom:0;transform:scale(-1,-1)}
.stage-wrap > .xl-corners{right:calc(412px + 1.6rem)}
.map-tools{border-radius:0}
.rail button .xl-emblem{width:19px;height:22px;margin-right:.35rem;filter:none}
.rail button{display:inline-flex;align-items:center}
.scard .sc-head{align-items:center}
.scard .sc-head .xl-emblem{width:48px;height:56px}
.scard .sc-head > div{flex:1;min-width:0}
.scard{border-radius:0}

/* Engraved divider */
.xl-divider{display:flex;justify-content:center;margin:0 auto;padding:2.2rem 1rem 0;max-width:22rem;color:var(--gold)}
.xl-divider svg{width:100%;height:16px}
.band{border-top:0}

/* Lore as book chapters */
.chapters{list-style:none;margin:0;padding:0;max-width:68ch}
.chapter{padding:1.6rem 0;border-top:1px solid var(--line)}
.chapter:first-child{border-top:0;padding-top:0}
.chapter .numeral{display:block;font-family:var(--font-display);color:var(--gold);font-size:1.6rem;line-height:1;margin-bottom:.5rem}
.chapter h3{font-family:var(--font-display);font-weight:400;font-size:1.5rem;margin-bottom:.6rem;color:var(--ivory-hi)}
.chapter p{line-height:1.7}
.xl-dropcap::first-letter{float:left;font-family:var(--font-display);font-size:3.6em;line-height:.82;padding:.08em .12em 0 0;color:var(--gold)}
.stages li::before{font-style:normal}

/* Region page */
.region-title{display:flex;align-items:center;gap:1.2rem;margin:.8rem 0 1rem}
.region-title .xl-emblem{width:120px;height:140px}
.region-title h1{margin:0 0 .4rem}
.arrival{font-family:var(--font-display);font-size:1.3rem;color:var(--text);border-left:1px solid var(--gold);padding-left:1.2rem}
.mini-frame{position:relative}
.mini-frame .xl-corners{inset:8px}
.balance .pos h2{color:var(--cyan)}.balance .neg h2{color:var(--warn)}

/* Passport: security print, emblem, machine zone */
.passport,.pp-artifact{position:relative;overflow:hidden;border-radius:0}
.passport > *,.pp-artifact > *{position:relative}
.passport > .xl-guilloche,.pp-artifact > .xl-guilloche{position:absolute;inset:0;width:100%;height:100%;color:var(--gold);opacity:.16;pointer-events:none}
[data-theme="light"] .passport > .xl-guilloche,[data-theme="light"] .pp-artifact > .xl-guilloche{opacity:.22}
.passport::before{display:none}
.passport{background:var(--surface-strong);border:1px solid var(--line-strong);box-shadow:inset 0 0 0 3px var(--panel-solid),inset 0 0 0 4px var(--brass-hairline)}
.pp-crest{position:absolute;right:1.4rem;top:1.2rem}
.passport .pp-crest .xl-emblem,.pp-artifact .pp-crest .xl-emblem{width:66px;height:77px}
.pp-artifact .pp-top{padding-right:90px}
.xl-mrz{display:grid;gap:.15rem;margin-top:1.4rem;padding-top:.9rem;border-top:1px dashed var(--line-strong);font-family:"OCR-B","OCR B",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:clamp(9px,2.3vw,13px);letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden}
.pp-stamp{position:absolute;right:1.4rem;bottom:4.6rem;width:96px;height:96px;display:grid;place-content:center;text-align:center;border:4px double var(--warn);border-radius:50%;color:var(--warn);transform:rotate(-8deg);opacity:.85;font-family:var(--font-display);font-size:1.15rem;line-height:1.1}
.pp-stamp span{display:block;font:600 12px var(--font-ui);letter-spacing:.06em}

/* Dock: engraved icons, gold for where you are */
@media (max-width:820px){
  .dock a{position:relative;font-size:14px;color:var(--muted)}
  .dock svg{width:25px;height:25px}
  .dock a[aria-current="page"]{color:var(--gold)}
  .dock a[aria-current="page"] svg{color:var(--gold);filter:none}
  .dock a[aria-current="page"]::before{content:"";position:absolute;top:-.4rem;left:22%;right:22%;height:2px;background:var(--gold)}
  .dock{border-radius:0;border-top:1px solid var(--brass-hairline)}
  .territory-row{grid-template-columns:1fr}
  .world-compass{right:.8rem;top:3.8rem;bottom:auto;width:58px;height:58px;z-index:4}
  .stage-wrap > .xl-corners{inset:6px;right:6px;bottom:auto;height:56svh;min-height:340px}
  .region-title .xl-emblem{width:82px;height:96px}
  .arrival{font-size:1.15rem}
  .theme-btn{width:34px;height:34px}
  .pp-stamp{width:78px;height:78px;font-size:.95rem;bottom:4.2rem}
  .passport .pp-crest .xl-emblem,.pp-artifact .pp-crest .xl-emblem{width:52px;height:61px}
}
@media (max-width:1100px) and (min-width:821px){ .territory-row{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .xl-emblem{transition:none !important;transform:none !important} }

/* Hero: keep the inscription clear of the island */
.hero-veil{background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 94%,transparent) 34%,color-mix(in srgb,var(--bg) 55%,transparent) 54%,transparent 72%),linear-gradient(0deg,var(--bg) 0%,transparent 26%)}
@media (max-width:820px){ .hero-veil{background:linear-gradient(0deg,var(--bg) 34%,color-mix(in srgb,var(--bg) 70%,transparent) 62%,transparent 84%)} }
@media (max-width:820px){ .world-panel{width:auto} }
code{font-size:14px}

/* Guide space: content and sticky actions sit above the floating first-steps guide */
main{padding-bottom:calc(var(--guide-h,0px) + 1rem)}
.action-bar{bottom:calc(1rem + var(--guide-h,0px) + env(safe-area-inset-bottom,0px))}
@media (max-width:820px){
  main{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px) + var(--guide-h,0px))}
  .action-bar{bottom:calc(76px + env(safe-area-inset-bottom,0px) + var(--guide-h,0px))}
  .guide{padding:.75rem .9rem;gap:.45rem}
  .guide p{font-size:16px;line-height:1.4}
  .guide .btn{min-height:40px !important;padding:.45rem 1rem !important;font-size:15px}
}
@media (min-width:821px){ .world-panel{bottom:calc(1rem)} }
@media (max-width:820px){ .toast{bottom:auto !important;height:auto} }
.toast.glass{align-items:center}
#app.no-anim .fade-in,#app.no-anim .world-panel,#app.no-anim .scard.pop{animation:none}
@media (min-width:821px){ main:has(> .world),main:has(> .hero){padding-bottom:0} }

/* Land plots on the map and in the codex */
.pl.plot{font-size:13.5px;padding:.18rem .5rem .2rem .42rem}
.pl.plot i{width:7px;height:7px;transform:none;border-radius:1px}
.pl.plot.sale{color:#F3EAD3;border-color:rgba(243,234,211,.35)}
.pl.plot.sale i{background:#F3EAD3;box-shadow:none}
.pl.plot.held{color:#F1D9A0;border-color:rgba(216,186,124,.5);background:rgba(28,20,8,.78)}
.pl.plot.held i{background:#D8BA7C;box-shadow:0 0 6px #D8BA7C}
.plot-tag{display:inline-block;margin-top:.35rem;padding:.12rem .55rem;font-size:15px;font-weight:600;border:1px solid var(--line-strong);border-radius:3px;white-space:nowrap}
.plot-tag.sale{color:var(--text);border-color:var(--gold);background:var(--gold-soft)}
.plot-tag.held{color:var(--gold)}
.plot-tag.mine{color:var(--cyan);border-color:var(--cyan)}
.scard .plot-tag{color:#F1D9A0;border-color:rgba(216,186,124,.5);background:none}
.world-panel,.scard{z-index:6}
.sc-parcel .sc-name{font-size:1.3rem;white-space:nowrap}
.sc-parcel span{display:block}
.sc-parcel .plot-tag{display:inline-block;margin-top:.4rem}
.pl.plot.sel{color:#fff;border-color:var(--gold);box-shadow:0 0 14px rgba(216,186,124,.5);z-index:2}

/* World economy panels */
.world-econ{margin-top:1.4rem;padding:1rem 1.1rem;border:1px solid var(--line-strong);border-left:3px solid var(--gold);background:linear-gradient(90deg,var(--gold-soft),transparent 70%)}
.world-econ h3{font-family:var(--font-display);font-weight:400;font-size:1.3rem;margin-bottom:.7rem}
.econ-bar{height:6px;background:var(--line);margin:.2rem 0 1rem;position:relative}
.econ-bar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brass-lo),var(--gold))}
.econ-world-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.econ-world-grid .world-econ{margin-top:0}
@media (max-width:820px){ .econ-world-grid{grid-template-columns:1fr} }

/* ===== r44 Plaxa market: shops between citizens ===== */
.shop-head{display:flex;align-items:center;gap:.9rem}
.shop-mark{width:44px;height:44px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.mkt-form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:.7rem;align-items:end;margin:1rem 0 .4rem}
.mkt-form .swap-row{margin:0;max-width:none}
.mkt-form .btn{height:fit-content}
@media (max-width:640px){ .mkt-form{grid-template-columns:1fr 1fr} .mkt-form .swap-row:first-child,.mkt-form .btn{grid-column:1/-1} }
.ord{display:inline-block;font-variant:small-caps;letter-spacing:.03em;padding:0 .45rem;border-radius:3px;border:1px solid var(--line);white-space:nowrap}
.ord-ok{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.ord-no{color:var(--muted)}
.ord-pending{color:var(--gold);border-color:var(--brass-hairline)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:1rem;margin-top:1rem}
.shop-card{padding:1rem 1.1rem}
.shop-card-h{display:flex;flex-direction:column;gap:.1rem;padding-bottom:.6rem;margin-bottom:.4rem;border-bottom:1px solid var(--brass-hairline)}
.shop-card-h b{font-family:var(--font-display);font-weight:400;font-size:1.25rem;color:var(--ivory-hi,var(--text))}
.shelf{list-style:none;margin:0;padding:0}
.shelf li{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.shelf li:last-child{border-bottom:0}
.shelf-g{display:flex;flex-direction:column;min-width:0}
.shelf-buy{display:flex;gap:.45rem;align-items:center;flex:none}
.shelf-buy .input{width:4.6rem;padding-left:.5rem;padding-right:.3rem}
.pp-licence{display:flex;align-items:center;gap:.55rem;margin:.6rem 0 1.6rem;font-size:var(--small)}
.pp-licence svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.pp-licence b{font-variant:small-caps;letter-spacing:.04em;color:var(--gold)}
@media (max-width:640px){ .tbl .upd{display:none} .otbl th,.otbl td{padding:.55rem .45rem} .ord{font-variant:normal;letter-spacing:0;padding:0 .3rem;white-space:normal} }

/* ===== r45 Population stages and territory shops ===== */
.pop-card{padding:1.1rem 1.3rem;margin:1.6rem 0 0}
.pop-card h2{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:0 0 .3rem}
.tshops{margin-top:2.2rem;padding-top:1.6rem;border-top:1px solid var(--brass-hairline)}
.tshops .shop-head{margin-top:1.8rem}

/* ===== r48 Shops on the living map ===== */
.pl.plot.shop{color:#FBE7B0;border-color:rgba(210,165,90,.55);background:rgba(26,18,5,.78)}
.pl.plot.shop i{background:#D2A55A;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 6px rgba(251,231,176,.6)}

/* ===== r50 Market news in ParX ===== */
.news{padding:.9rem 1.1rem;margin-top:1.2rem}
.news h3{font-family:var(--font-display);font-weight:400;font-size:1.2rem;margin:0 0 .4rem}
.news li{padding:.25rem 0}

/* ===== r52 Server wallet status ===== */
.wallet-status{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;margin:0 0 1.2rem}
.wallet-status svg{width:28px;height:28px;flex:none}

/* ---- Shared Xiberal Assembly ----
   Proposals live in gov/<proposer>, ballots in ballots/<voter>; each citizen writes only their own.
   Phases, tallies and the law set are derived deterministically by every client from the same shared data,
   so no single client is the executor and nobody can rewrite another citizen's vote. */
const GOVS = { policyVersion:'gov-shared-1', discussSecs:300, votingSecs:7200, timelockSecs:120, quorumPct:25, eligibleWindowDays:14 };

function sharedProposals(){ const out=[]; Object.entries(social.gov).forEach(([uid,d])=>(d.proposals||[]).forEach(p=>out.push(Object.assign({uid},p)))); return out.sort((a,b)=>a.publishedAt-b.publishedAt); }

function quorumFor(n){ return Math.max(1, Math.ceil(n*GOVS.quorumPct/100)); }
function sharedTally(p){ const v={yes:0,no:0,abstain:0};

  const T=ptypeOf(p.type,{laws:[]}), H=T&&HANDLERS[T.handler], irr=!!(H&&H.law&&LAWDEF[H.law]&&!LAWDEF[H.law].reversible), cast=v.yes+v.no+v.abstain;
  const quorum=cast>=(p.quorum||1), threshold=irr?(v.yes+v.no>0&&v.yes*3>=(v.yes+v.no)*2):v.yes>v.no;

function computeSharedLaws(){ const laws=[], st={laws, ledger:[]}, now=Date.now(), results={};

/* Every client applies the shared law set to its own simulation, once per law, and records it in its own Chronicle. */
function syncSharedLaws(){ if(!sharedMode()) return false; let ch=false;
  if(!state.localLawsArchived){ state.localLaws=(state.laws||[]).slice(); state.localLawsArchived=true; ch=true; }
