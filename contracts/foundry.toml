# Xland's Base contracts (r57). Run: tools/contracts-test.sh (fetches pinned dependencies from GitHub into contracts/lib).
[profile.default]
src = "src"
test = "test"
out = "out/forge"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [{ access = "read", path = ".." }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/", "base-std/=lib/base-std/src/", "base-std-test/=lib/base-std/test/"]
