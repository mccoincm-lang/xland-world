    case 'homax-unlist': state.listing=null; save(); render(); break;
    case 'build-start': { if(!here('xetropolitan')||state.construct||state.builds.length||!lawOn('permit-special')) return; const need=BigInt(SIM.monumentQuarx)*UNIT;
      const name=(($('#bd-name')&&$('#bd-name').value)||'').trim().slice(0,32)||'Monument of the First Settlers';
      const k=Date.now().toString(36), op='build-lock-'+k;
      if(!lockLedger(state,op,'LOCK','quarx',need,`QuarX reserved for construction: ${name}`,'civicsite')){ toast('Not enough QuarX.'); return; }
      const t=Date.now(); state.construct={name,start:t,end:t+SIM.monumentSecs*1000,op,key:k,reserved:need.toString()}; save(); render(); toast('QuarX reserved. Construction started.'); break; }
    case 'build-cancel': { const c=state.construct; if(!c||!c.reserved) return; lockLedger(state,'build-unlock-'+c.key,'UNLOCK','quarx',BigInt(c.reserved),`Construction cancelled before commitment: ${c.name}. QuarX returned.`,'civicsite');
      state.construct=null; save(); render(); toast('Construction cancelled. QuarX returned.'); break; }
    case 'build-done': { const c=state.construct; if(!c||Date.now()<c.end) return; if(c.reserved) useVested(state,BigInt(c.reserved));
      if(c.reserved && !lockLedger(state,'build-consume-'+c.key,'CONSUME','quarx',BigInt(c.reserved),`QuarX consumed by construction: ${c.name}`,'civicsite','consumed:civicsite')) return;
      state.builds.push({name:c.name, at:Date.now()}); state.construct=null;
      chron('SpecialBuilding',`${c.name} raised in Xetropolitan`,`A Special Building now stands in the Civic plaza, built with ${SIM.monumentQuarx} QuarX.`,'xetropolitan','legacy');
      save(); render(); toast(`${c.name} is complete.`); break; }
    case 'gov-draft': { if(!here('xetropolitan')||!govCapabilities()[2][1]||(sharedMode()&&id==='xcool-program')) return; state.govDraft={type:id, stage:'DRAFT', at:Date.now()}; emit('PROPOSAL_DRAFTED',{type:id}); save(); render(); break; }
    case 'gov-discard': state.govDraft=null; save(); render(); break;
    case 'gov-review': { const dr=state.govDraft; if(!dr) return; dr.rationale=(($('#gov-why')||{}).value||'').trim().slice(0,160); const T=ptypeOf(dr.type), H=HANDLERS[T.handler];
      const err=H.validate(state,T.arg); dr.review=[['Schema: typed proposal with an allowlisted handler',true,''],['Authority: '+T.authority,true,''],['Eligibility: SUBMIT_PROPOSAL',govCapabilities()[3][1],''],['Handler validation against the current state',!err,err||'']];
      dr.stage='REVIEW'; save(); render(); break; }
    case 'gov-publish': { if(sharedMode()){ const dr=state.govDraft; if(!dr||dr.stage!=='REVIEW'||!dr.review.every(r=>r[1])) return; const T=ptypeOf(dr.type), H=HANDLERS[T.handler], t=Date.now();
        const content={type:dr.type, title:T.title, current:H.current(state,T.arg), proposed:H.proposed(state,T.arg), rationale:dr.rationale, authority:T.authority};
        const pid='XA-'+t.toString(36).toUpperCase(), prop=Object.assign({pid, version:1, hash:contentHash(content), proposerHandle:(state.privacy||{}).name!=='private'?state.handle:'', publishedAt:t, votingAt:t+GOVS.discussSecs*1000, closesAt:t+(GOVS.discussSecs+GOVS.votingSecs)*1000, executeAt:t+(GOVS.discussSecs+GOVS.votingSecs+GOVS.timelockSecs)*1000, quorum:quorumFor(eligibleCitizenCount()), policyVersion:GOVS.policyVersion}, content);
        const mine=clonePlain(social.gov[social.me]||{proposals:[]}); mine.proposals=(mine.proposals||[]).concat([prop]).slice(-40);
        social.db.doc('gov/'+social.me).set(mine).then(()=>{ state.govDraft=null; emit('PROPOSAL_PUBLISHED',{proposal:pid}); emit('DELIBERATION_STARTED',{proposal:pid}); emit('GOVERNANCE_ACTION_RECORDED',{action:'propose',proposal:pid});
          chron('MotionProposed',`Proposal published to the shared Assembly: ${T.title}`,`${pid}, version 1. Quorum ${prop.quorum}.`,'xetropolitan','ordinary'); save(); render(); toast('Published to the Assembly. Deliberation has begun.'); })
          .catch(e=>{ if(e&&e.code==='invalid_argument'){ social.writable=false; } toast('Could not publish: '+((e&&e.message)||'error')); render(); }); break; }
      const dr=state.govDraft; if(!dr||dr.stage!=='REVIEW'||!dr.review.every(r=>r[1])) return; const T=ptypeOf(dr.type), H=HANDLERS[T.handler], t=Date.now();
      const content={type:dr.type, title:T.title, current:H.current(state,T.arg), proposed:H.proposed(state,T.arg), rationale:dr.rationale, authority:T.authority};
      const pid='XA-'+(state.proposals.length+1); state.proposals.push(Object.assign({pid, version:1, hash:contentHash(content), proposer:state.passportId, status:'DELIBERATION', publishedAt:t, votingAt:t+GOV.discussSecs*1000, closesAt:t+(GOV.discussSecs+GOV.votingSecs)*1000, votes:{yes:0,no:0,abstain:0}, ballots:{}, policyVersion:GOV.policyVersion}, content));
      state.govDraft=null; emit('PROPOSAL_PUBLISHED',{proposal:pid}); emit('DELIBERATION_STARTED',{proposal:pid}); emit('GOVERNANCE_ACTION_RECORDED',{action:'propose',proposal:pid});
      chron('MotionProposed',`Proposal published: ${T.title}`,`${pid}, version 1, published to the Xiberal Assembly for deliberation.`,'xetropolitan','ordinary'); save(); render(); toast('Proposal published. Deliberation has begun.'); break; }
    case 'gov-vote': { if(sharedMode()){ const sp=sharedProposals().find(x=>x.pid===id), c=b.dataset.v; if(!sp||sharedPhase(sp)!=='VOTING'||!govCapabilities()[4][1]||!['yes','no','abstain'].includes(c)) return;
        const mine=clonePlain(social.ballots[social.me]||{votes:{}}); mine.votes=mine.votes||{}; const replaced=!!mine.votes[id]; if(replaced&&mine.votes[id].choice===c) return;
        mine.votes[id]={choice:c, at:Date.now(), identity:state.identity, policy:GOVS.policyVersion};
        social.db.doc('ballots/'+social.me).set(mine).then(()=>{ emit(replaced?'VOTE_REPLACED':'VOTE_RECORDED',{proposal:id, choice:c}); emit('GOVERNANCE_ACTION_RECORDED',{action:'vote',proposal:id}); save(); toast(`Vote recorded: ${c}.`); })
          .catch(e=>toast('Could not vote: '+((e&&e.message)||'error'))); break; }
      const p=state.proposals.find(x=>x.pid===id); const c=b.dataset.v; if(!p||p.status!=='VOTING'||!govCapabilities()[4][1]||!['yes','no','abstain'].includes(c)) return;
      p.ballots=p.ballots||{}; const prev=p.ballots[state.passportId];
      if(prev){ if(prev.choice===c) return; if(!GOV.revote) return; p.votes[prev.choice]--; emit('VOTE_REPLACED',{proposal:id}); }
      p.votes[c]++; p.ballots[state.passportId]={choice:c, weight:1, eligibility:{identity:state.identity, policy:GOV.policyVersion}, submittedAt:Date.now(), status:'accepted'}; p.myVote=c;
      emit('VOTE_RECORDED',{proposal:id, choice:c}); emit('GOVERNANCE_ACTION_RECORDED',{action:'vote',proposal:id}); save(); render(); toast(`Vote recorded: ${c}.`); break; }
    case 'rent': { const pl=id, n=+b.dataset.n, region=PL[pl].region; if(!here(region)) return; const price=BigInt(pl==='resort'?n*SIM.resortNight:SIM.shopRent)*UNIT;
      const op=opId('rent-'+pl); if(!postLedger(state,op,[['bux',-price]],pl==='resort'?`Xalp lodge, ${n} night${n>1?'s':''} (tax-free)`:`Shoppex lease, ${SIM.shopDays} days`,pl)){ toast('Not enough BuX.'); return; }
      const t=Date.now(); state.rentals.push({place:pl, start:t, end:t+n*86400000, op});
      if(state.rentals.filter(r=>r.place===pl).length===1) chron('Rental', pl==='resort'?'First stay in Xalp':'First urban lease in Xetropolitan', pl==='resort'?`You rented a lodge for ${n} night${n>1?'s':''}.`:'You leased a Shoppex unit inside Plaxa.', region, 'ordinary');
      save(); render(); toast('Rental confirmed.'); break; }
    case 'tx-convert': { const r=evaluate('tundrax','convert',{ownsHome:false, ageOk:false, depositOk:BigInt(state.bal.bux)>=BigInt(TERR.tundrax.conversion.depositBuX)*UNIT});
      if(!r.ok){ if(!state.blocked.includes(r.key)) state.blocked.push(r.key); save(); const o=$('#law-out'); if(o) o.innerHTML=`<div class="lawcard"><b>Not eligible yet</b><p>${esc(r.law)}</p></div>`; } break; }
    case 'attend': { if(!here(id)||state.attended.includes(id)) return; state.attended.push(id); save(); render(); toast('You attended the Ixeland assembly.'); break; }
    case 'rare-buy': { if(!here('xahara')||state.rareBought[id]) return; const l=rareListings().find(x=>x.key===id); if(!l) return;
      const op='rare-'+id; if(!postLedger(state,op,[['bux',-BigInt(l.price)*UNIT]],`Xahara bazaar: ${l.name} from an outside seller`,'bazaar')){ toast('Not enough BuX.'); return; }
      state.rareBought[id]=1; state.items.push({name:l.name, from:'Outside seller', basis:String(BigInt(l.price)*UNIT), at:Date.now()});
      if(state.items.length===1) chron('RareAsset','First rare asset from Xahara',`You bought ${l.name} from an outside seller at the bazaar.`,'xahara','notable');
      save(); render(); toast(`Acquired ${l.name}.`); break; }
    case 'search-start': { if(!here('xahara')||state.search) return; const t=Date.now(); state.search={start:t,end:t+SIM.searchSecs*1000,op:opId('search')}; state.searchLog.push(t); save(); render(); break; }
    case 'search-done': { const s0=state.search; if(!s0||Date.now()<s0.end) return; state.search=null;
      if(Math.random()*100<SIM.searchChancePct){ const name='Golden bit #'+(1000+Math.floor(Math.random()*9000)); state.items.push({name, from:'Found in the dunes', basis:'0', at:Date.now()}); toast(`You found ${name}.`);
        if(state.items.length===1) chron('RareAsset','First golden bit found',`Searching the Xahara dunes, you found ${name}.`,'xahara','notable'); }
      else toast('The dunes gave nothing this time.');
      save(); render(); break; }
    case 'em-apply': state.emergency={feature:'farmxswap', reason:'Security drill: venue temporarily disabled under operational policy', actor:'World Architect (prototype)', at:Date.now()}; emit('EMERGENCY_ACTION_APPLIED',{feature:'farmxswap'}); save(); render(); break;
    case 'em-end': state.emergency=null; emit('EMERGENCY_ACTION_ENDED',{feature:'farmxswap'}); save(); render(); break;
    case 'ev-start': startEvent(id,state,0); save(); render(); toast(`World event: ${WEVENTS[id].name}`); break;
    case 'ev-clear': state.worldEvents=state.worldEvents.filter(e=>e.id!==id); save(); render(); break;
    case 'm-accept': { const m=MBY[id]; if(!m||missionState(m)!=='AVAILABLE') return; if(MISSIONS.filter(x=>state.mstate[x.id]==='active').length>=MAX_ACTIVE){ toast(`You can follow up to ${MAX_ACTIVE} missions at once. Finish one first.`); return; }
      state.mstate[id]='active'; emit('QUEST_STARTED',{mission:id}); save(); render(); break; }
    case 'm-drop': if(state.mstate[id]==='active'){ delete state.mstate[id]; save(); render(); } break;
    case 'm-reward': { const m=MBY[id]; if(!m||missionState(m)!=='COMPLETED') return; state.mstate[id]='rewarded'; emit('QUEST_COMPLETED',{mission:id}); emit('REWARD_GRANTED',{mission:id, policy:m.reward});
      if(m.reward==='knowledge') REGIONS.forEach(r=>{ if(!state.inspected.includes(r.id)) state.inspected.push(r.id); });
      chron('MissionCompleted',`Mission completed: ${m.title}`,m.consequence,m.place&&PL[m.place]?PL[m.place].region:null,['world','identity'].includes(m.reward)?'notable':'ordinary');
      save(); render(); toast(`Mission completed: ${m.title}`); break; }
    case 'd-accept': { const d=(state.dyn||[]).find(x=>x.id===id); if(!d||dynState(d)!=='AVAILABLE') return; d.state='ACTIVE'; d.acceptedAt=Date.now(); save(); render(); break; }
    case 'd-reward': { const d=(state.dyn||[]).find(x=>x.id===id); if(!d||dynState(d)!=='COMPLETED') return; d.closed=true; d.state='ARCHIVED'; emit('QUEST_COMPLETED',{mission:d.id, template:d.tpl});
      chron('SupplyDelivered',`City supply request fulfilled: ${AS[d.asset].sym}`,`You delivered ${d.target} ${AS[d.asset].sym} to Xetropolitan at Forgex. Demand was ${d.snapshot.demand} when the request was posted.`,'xetropolitan','ordinary'); save(); render(); break; }
    case 'p-name': { const v=($('#pp-name').value||'').trim().replace(/\s+/g,' '); if(!HANDLE_RE.test(v)){ toast('Use 2 to 24 characters.'); return; } state.handle=v; emit('PROFILE_UPDATED',{field:'displayName'}); save(); render(); toast('Display name updated. Your citizen ID stays the same.'); break; }
    case 'p-priv': { const order=['private','citizens','public']; const cur=state.privacy[id]||(id==='presence'?'citizens':'private'); state.privacy[id]=order[(order.indexOf(cur)+1)%3]; save(); render(); break; }
    case 'ppx-post': { if(!social.db||!social.writable||!here('xetropolitan')) return; const ta=$('#ppx-text'); const text=((ta&&ta.value)||'').trim().slice(0,280); if(!text){ toast('Write something first.'); return; }
      if(Date.now()-social.lastPost<10000){ toast('Give the square a moment: one message every 10 seconds.'); return; } social.lastPost=Date.now();
      const doc=myPosts(); doc.msgs=(doc.msgs||[]).concat([{id:Date.now().toString(36)+Math.random().toString(36).slice(2,5), text, at:Date.now(), handle:(state.privacy||{}).name!=='private'?state.handle:'', region:state.currentRegion}]);
      (async()=>{ try{ await writeMyPosts(doc); if(ta) ta.value=''; state.parxPosts=(state.parxPosts||0)+1; const log=state.services.parx||(state.services.parx=[]); if(!log.some(t=>t>=nowDay())) log.push(Date.now()); emit('SOCIAL_MESSAGE_POSTED',{place:'parx'}); save(); toast('Spoken in ParX.'); }
        catch(e){ if(e&&e.code==='invalid_argument'){ social.writable=false; render(); } toast('Could not post: '+((e&&e.message)||'unknown error')); } })(); break; }
    case 'ppx-del': { const doc=myPosts(); doc.msgs=(doc.msgs||[]).filter(m=>m.id!==id); writeMyPosts(doc).catch(()=>toast('Could not delete.')); break; }
    case 'ppx-report': { const doc=myPosts(); doc.reports=(doc.reports||[]).filter(r=>!(r.uid===b.dataset.uid&&r.mid===id)).concat([{uid:b.dataset.uid, mid:id, at:Date.now()}]); writeMyPosts(doc).then(()=>toast('Reported to the owner. Thank you.')).catch(()=>toast('Could not report.')); break; }
    case 'ppx-remove': { if(!social.isOwner) return; const uid=b.dataset.uid, d=clonePlain(social.posts[uid]||{}); d.msgs=(d.msgs||[]).filter(m=>m.id!==id); social.db.doc('posts/'+uid).set(d).then(()=>{ emit('MODERATION_REMOVED',{}); toast('Message removed.'); }).catch(()=>toast('Could not remove.')); break; }
    case 'guide-min': state.guide=Object.assign({},state.guide,{min:true}); save(); renderGuide(parse().route); break;
    case 'guide-open': state.guide=Object.assign({},state.guide,{min:false,hidden:false}); save(); renderGuide(parse().route); break;
    case 'guide-hide': state.guide=Object.assign({},state.guide,{hidden:true}); save(); renderGuide(parse().route); toast('Guide hidden. You can bring it back from your Passport.'); break;
    case 'intro-next': clearTimeout(introTimer); introIdx=Math.min(INTRO.length-1,introIdx+1); drawIntro(); break;
    case 'intro-end': endIntro(); break;
    case 'intro-replay': showIntro(); break;
    case 'presale-buy': { const r0=presaleBuy(state, +b.dataset.n); if(!r0.ok){ const o=$('#law-out'); if(o) o.innerHTML=`<div class="lawcard"><b>Not possible</b><p>${esc(r0.why)}</p></div>`; return; }
      emit('PRESALE_SIMULATED',{qty:+b.dataset.n}); save(); render(); toast(`Pre-bought ${b.dataset.n} Forerunner QuarX (simulation).`); break; }
    case 'key-copy': { const k=serverBE&&serverBE.key(); if(!k) return; (navigator.clipboard?navigator.clipboard.writeText(k):Promise.reject()).then(()=>toast('Key copied. Keep it private.')).catch(()=>{ ui.showKey=true; render(); toast('Copy the key shown on the page.'); }); break; }
    case 'key-show': ui.showKey=!ui.showKey; render(); break;
    case 'key-use': { const v=(($('#key-in')||{}).value||'').trim(); if(!/^[A-Za-z0-9_\-]{32,128}$/.test(v)){ toast('That does not look like a citizen key.'); return; }
      if(serverBE&&v===serverBE.key()){ toast('This device already uses that key.'); return; }
      clearTimeout(saveTimer); remote=null; lsSet(KEY_LS,v); lsSet('xland.adopt','1'); try{ localStorage.removeItem(LS_KEY); }catch(e){} state=fresh(); location.hash='#/profile'; location.reload(); break; }
    case 'admin-use': { const v=(($('#admin-in')||{}).value||'').trim(); if(!v) return; lsSet(ADMIN_LS,v); location.reload(); break; }
    case 'fb-open': openFeedback(); break;
    case 'theme': { const t=document.documentElement.dataset.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=t; document.documentElement.style.colorScheme=t; try{ localStorage.setItem('xland.theme',t); }catch(_){} renderChrome(parse().route==='home'?'':parse().route); break; }
    case 'fb-close': $('#fb').hidden=true; $('#fb').innerHTML=''; break;
    case 'fb-rate': fbRating=+b.dataset.n; document.querySelectorAll('.fb-stars button').forEach((x,i)=>x.classList.toggle('on',i<fbRating)); break;
    case 'fb-send': sendFeedback(); break;
    case 'service': { const q=PL[id]; if(!q||!SERVICES[id]||!here(q.region)) return; const log=state.services[id]||(state.services[id]=[]); if(log.some(t=>t>=nowDay())) return;
      log.push(Date.now()); emit('INSTITUTION_SERVICE_USED',{place:id}); emit('INSTITUTION_PARTICIPATION_RECORDED',{place:id}); emit('INSTITUTION_INTERACTED',{place:id});
      if(id==='xcool'){ REGIONS.forEach(r=>{ if(!state.inspected.includes(r.id)) state.inspected.push(r.id); }); toast('Workshop complete. Every territory is now known to you.'); } else toast('Recorded in your civic history.');
      save(); render(); break; }
    case 'title': state.title=b.dataset.v||null; if(state.title) emit('TITLE_GRANTED',{id:state.title}); save(); render(); break;
    case 'law': { const out=$('#law-out'); if(out) out.innerHTML=lawBlock(id); break; }
    case 'reset':
      if(!resetArmed){ resetArmed=true; render(); return; }
      resetArmed=false; state=fresh(); save(); ui.selected=null; location.hash='#/'; render(); toast('Prototype data erased.'); break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='fc-price'||e.target.id==='fc-years'){ const o=$('#fc-out'); if(o) o.textContent=floorText($('#fc-price').value,$('#fc-years').value); }
  if(e.target.id==='sw-amt' && ui.swap){ ui.swap.amount=e.target.value; ui.swap.quotedAt=Date.now(); const qd=$('#sw-quote'); if(qd) qd.innerHTML=quoteHTML(ui.swap.venue); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='sw-asset' && ui.swap){ ui.swap.asset=e.target.value; ui.swap.op=opId('swap-'+ui.swap.venue); const a=$('#activity'); if(a) a.innerHTML=activity(PL[ui.swap.venue]); }
});
document.addEventListener('keydown', e=>{
  const el=e.target.closest && e.target.closest('.map-full [data-region]');
  if(el && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); select(el.dataset.region); }
  if(e.target.id==='hx-handle' && e.key==='Enter'){ e.preventDefault(); const btn=document.querySelector('[data-act="hx-name"]'); if(btn) btn.click(); }
});

render();
connect();
setTimeout(()=>{ let seen=state.introSeen; try{ seen=seen||localStorage.getItem('xland.introSeen'); }catch(e){} if(!seen && !state.passport && (location.hash===''||location.hash==='#/')) showIntro(); },900);
setTimeout(()=>{ rollDailyEvent(); },2600);
setTimeout(()=>{ if(!state.passport) return; const gone=Date.now()-(state.lastSeen||0), ready=[];
  if(state.plot&&Date.now()>=state.plot.end) ready.push('a harvest is ready in FarmX'); if(state.mine&&Date.now()>=state.mine.end) ready.push('QuarX is ready in Xalp'); if(state.construct&&Date.now()>=state.construct.end) ready.push('your construction is complete');
  if(gone>10*60000 || ready.length) toast(`Welcome back, ${state.handle}.${ready.length?' '+ready.join('; ')+'.':''}`); state.lastSeen=Date.now(); save(); },1400);
setInterval(()=>{
  document.querySelectorAll('.timer').forEach(t=>{ const st=+t.dataset.start, en=+t.dataset.end; const pct=Math.min(100,(Date.now()-st)/(en-st)*100);
    const b=t.querySelector('.tbar span'); if(b) b.style.width=pct.toFixed(1)+'%'; const l=t.querySelector('.tleft'); if(l) l.textContent=fmtSecs(secsLeft(en));
    if(Date.now()>=en && !t.dataset.done){ t.dataset.done='1'; const a=$('#activity'), {route,arg}=parse(); if(a && route==='place') a.innerHTML=activity(PL[arg]); } });
  if(advanceProposals()){ save(); const {route,arg}=parse(); if(route==='place'&&arg==='complex'){ const a=$('#activity'); if(a) a.innerHTML=activity(PL.complex); } }
  state.projects.filter(x=>x.status==='active'&&!x.committed&&Date.now()>=x.commitAt).forEach(x=>{ projectCommit(state,x); emit('BUILD_COMMITTED',{parcel:x.parcel}); save(); toast('Foundation complete: resources committed.'); });
  [['plot','Harvest ready at the FarmX fields.'],['mine','QuarX ready to collect in Xalp.'],['construct','Construction complete in the Civic plaza.']].forEach(([k,msg])=>{
    const o=state[k]; if(o && Date.now()>=o.end && !state.notified[o.op]){ state.notified[o.op]=1; toast(msg); } });
},1000);
})();
</script>
